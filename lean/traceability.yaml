    status: proved-in-abstract-model
    theorems:
      - Proteus.Exploration.Publication.isDiscriminating_eq
      - Proteus.Exploration.Publication.constantList_false_witness
      - Proteus.Exploration.Publication.inertValues_false_witness
      - Proteus.Exploration.Publication.discriminating_gives_two_values
      - Proteus.Exploration.Publication.published_implies_discriminated
      - Proteus.Exploration.Publication.retroPublished_implies_discriminated
      - Proteus.Exploration.Publication.non_discriminating_run_publishes_nothing
      - Proteus.Exploration.Publication.discrimination_is_not_relevance
    tsRefs:
      - packages/core/src/strategy/objective.ts:66
      - packages/core/src/strategy/objective.ts:88
      - packages/core/src/strategy/objective.ts:467
    remainingEvidence:
      - S1's literal second conjunct, that the verifier COULD have failed, is counterfactual and remains unmodelled under PR-DISCRIM-003
      - An objective that varies and still measures the wrong quantity satisfies every theorem here, as discrimination_is_not_relevance states
      - No implementation of B1 exists yet
  PR-DISCRIM-002:
    statement: Section 3.8 B1 needs its own k and its own distinctness to be sound: below two distinct measured candidates variation is inexpressible rather than absent, and an identity-free reading admits a nondeterministic verifier's noise as discrimination.
    status: proved-in-abstract-model
    theorems:
      - Proteus.Exploration.Publication.single_candidate_is_insufficient_not_inert
      - Proteus.Exploration.Publication.two_equal_candidates_are_inert
      - Proteus.Exploration.Publication.identity_free_b1_accepts_verifier_noise
      - Proteus.Exploration.Publication.baseline_supplies_the_second_value
      - Proteus.Exploration.Publication.unmeasurable_does_not_discriminate
    tsRefs:
      - packages/core/src/strategy/objective.ts:66
      - packages/core/src/strategy/objective.ts:410
    remainingEvidence:
      - These are findings against an unimplemented check, so nothing in the tree yet exhibits or fixes the defects
      - Whether the measured baseline is counted among the distinct candidates is a decision the spec has not taken explicitly
