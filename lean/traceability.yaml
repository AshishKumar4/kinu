      - Proteus.Exploration.Settle.settleOf_depends_only_on_score_and_advance
      - Proteus.Exploration.Settle.settleOf_is_not_constant
      - Proteus.Exploration.Settle.every_settle_kind_is_reachable
    tsRefs:
      - packages/core/src/strategy/swarm.ts:74
      - packages/core/src/strategy/swarm.ts:230
      - packages/core/src/strategy/swarm.ts:83
    remainingEvidence:
      - Totality is definitional for a function on inductive types, so the fibre equivalences rather than totality carry the content
      - Nothing connects these fibres to the section 6.6 coverage fixture, which does not exist yet
      - The model says nothing about whether a run whose settle is archive actually returns an archive
  PR-ARCHIVE-001:
    statement: A function-typed descriptor partitions candidates totally and disjointly while a judged or partial descriptor provably refutes the partition, and a coverage report never names a cell nothing landed in.
    status: proved-in-abstract-model
    theorems:
