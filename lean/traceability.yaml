  PR-PROPOSAL-001:
    statement: An accepted branch proposal always lands within the depth cap, the remaining budget and the declared width range and never widens the search's resolved context policy, for every proposal including adversarial ones.
    status: proved-in-abstract-model
    theorems:
      - Proteus.Exploration.Arbitration.accepted_iff
      - Proteus.Exploration.Arbitration.accepted_children_within_depth
      - Proteus.Exploration.Arbitration.accepted_within_budget
      - Proteus.Exploration.Arbitration.accepted_width_in_range
      - Proteus.Exploration.Arbitration.accepted_respects_context
      - Proteus.Exploration.Arbitration.archive_refuses_at_node
      - Proteus.Exploration.Arbitration.arbitrate_at_zero_depth_always_refuses
      - Proteus.Exploration.Arbitration.every_proposal_gets_a_verdict
      - Proteus.Exploration.Arbitration.a_legal_proposal_is_accepted
      - Proteus.Exploration.Arbitration.every_refusal_is_reachable
      - Proteus.Exploration.Arbitration.an_adversarial_proposal_is_refused
    tsRefs:
      - packages/core/src/strategy/swarm.ts:74
      - packages/core/src/strategy/swarm.ts:927
      - packages/core/src/strategy/swarm.ts:973
      - packages/core/src/strategy/swarm.ts:1043
    remainingEvidence:
      - That a tool which can only refuse is omitted from the assembled surface is a tool-assembly property Lean does not see and a containment test covers
      - The shipped arbiter (swarm.ts arbitrateBranch, debited in swarm-budget.ts) is a hand-written port of this definition rather than one refined from it, so fidelity rests on reading the two side by side
      - What an accepted verdict actually spawns is unmodelled, so S3's production truth still rests on uct.ts
  PR-ISOLATION-001:
    statement: A transition in which a node acquires its own storage does not satisfy the branch-side actions of the existing MCTS transition relation, and the frame condition that proof consumes is not removable.
    status: proved-in-abstract-model
    theorems:
      - Proteus.Exploration.Isolation.agent_node_is_not_a_branch_explore
      - Proteus.Exploration.Isolation.agent_node_is_not_a_branch_evaluate
      - Proteus.Exploration.Isolation.dropping_the_frame_condition_breaks_isolation
      - Proteus.Exploration.Isolation.agent_node_step_is_representable
    tsRefs:
      - packages/cf-backend/src/exploration.ts:6
      - packages/core/src/strategy/swarm.ts:19
    remainingEvidence:
      - This requirement deliberately proves NO agent-node isolation property; unit:'trajectory' is blocked on per-node workspace isolation which does not exist
      - An agent-node region needs a new action with a fresh provably-disjoint storage id per node and its own preservation proof
      - PR-MCTS-003's caveat that branch postconditions are hand-asserted rather than refined applies here unchanged
  PR-DISCRIM-003:
    statement: Whether a verifier COULD have failed on inputs it was not given is the counterfactual half of section 10.1 S1 and has no abstract model.
    status: specified-not-modeled
    theorems: []
    tsRefs:
      - packages/core/src/strategy/objective.ts:108
      - packages/core/src/strategy/objective.ts:137
    remainingEvidence:
      - A counterfactual about a verifier's behaviour on unseen inputs needs a semantics for the verifier, which the abstract model does not have
      - Section 3.8 B1 supplies an observable surrogate, modelled under PR-DISCRIM-001, and the two claims are not the same claim
  PR-PUBLISH-004:
    statement: Whether the publication seal is respected when two runs act concurrently on one objective is unmodelled, because the step relation is a single sequential fold.
    status: specified-not-modeled
    theorems: []
    tsRefs:
      - packages/core/src/strategy/objective.ts:288
      - packages/core/src/strategy/objective.ts:467
    remainingEvidence:
      - A concurrent model, or a store-level conditional write on the seal, is required and neither exists
      - The records store is a read-modify-write surface, so this is where the gap would bite first
  PR-EXPL-002:
    statement: Conditions under which a fallible verifier with nonzero discrimination eventually improves the incumbent or the run reports gain decay remain specified with no probabilistic Lean model.
    status: specified-not-modeled
    theorems: []
    tsRefs:
      - packages/core/src/strategy/objective.ts:351
      - packages/core/src/strategy/swarm.ts:83
    remainingEvidence:
      - The claim needs a distribution over candidate quality and a discrimination parameter, neither of which the abstract model has
      - The useful half even unproved is that a run must report gain decay rather than imply the surface is exhausted, and nothing reports it yet
