    theorems: []
    tsRefs:
      - packages/core/src/mcts/uct.ts:33
    remainingEvidence:
      - The current implementation selects a global open-node argmax rather than performing UCT root descent
      - The max-one visit clamps create plateaus and root self-parenting defeats a global self-antitonic claim
