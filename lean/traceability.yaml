      - packages/core/src/strategy/swarm.ts:217
    remainingEvidence:
      - The report shape is this model's construction; section 3.7 specifies the return contract but no code emits these outcomes
      - insufficientEvidence is a fourth outcome this model introduced and the spec does not yet name it
  PR-SETTLE-001:
    statement: settleOf is total over the score and advance axes and its four clauses are exact fibres, so no archive or pareto region can settle to a scalar winner and settle depends on no other field.
    status: by-construction-witness
    theorems:
      - Proteus.Exploration.Settle.settle_is_total
      - Proteus.Exploration.Settle.settle_total_over_axes
      - Proteus.Exploration.Settle.settleOf_archive_iff
      - Proteus.Exploration.Settle.settleOf_front_iff
      - Proteus.Exploration.Settle.settleOf_merge_iff
