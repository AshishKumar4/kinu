      - Kinu.MCTS.Uct.select_is_maximal
      - Kinu.MCTS.Uct.select_none_iff
      - Kinu.MCTS.Uct.an_outranked_row_is_never_selected
      - Kinu.MCTS.Uct.the_more_visited_of_two_equal_siblings_is_never_selected
