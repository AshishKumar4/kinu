      - packages/core/src/mcts/frontier.ts#selectFrontierNode
      - packages/core/src/config.ts#DEFAULT_CONFIG
    remainingEvidence:
      - The order is exact in real arithmetic; SQLite evaluates the score in IEEE-754 doubles, so two bonuses the model orders strictly can round to one score, and the fixture accepts either row of such a tie
      - bonus_order_is_power_order takes the real-number facts it rests on (increasing square root and logarithm, the logarithm of a power, clearing denominators) as premises rather than proving them
      - SQLite's order among rows with equal scores is unspecified, so the theorems claim only what every tie-break gives
      - The rise at the root from two visits to three follows from the shipped floor max(2, visits) and no decision records it as intended
      - The fixture runs the query on bun:sqlite; the Durable Object's SQLite build is not exercised by it
