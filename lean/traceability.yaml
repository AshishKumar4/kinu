      - packages/core/src/strategy/objective.ts:420
      - packages/core/src/strategy/swarm.ts:57
    remainingEvidence:
      - Section 10.1 S2 quantifies over one direction and one isBetter, so it does not type-check against VectorObjective and the spec has not been amended
      - The front property is strictly weaker than S2 and no code implements either
