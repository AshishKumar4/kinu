      - Proteus.Exploration.Records.writes_monotone
      - Proteus.Exploration.Records.better_candidate_displaces
      - Proteus.Exploration.Records.tie_does_not_displace
      - Proteus.Exploration.Records.eviction_can_destroy_the_population
    tsRefs:
      - packages/core/src/strategy/objective.ts:451
      - packages/core/src/strategy/objective.ts:467
      - packages/core/src/strategy/objective.ts:395
    remainingEvidence:
      - Writes are sequential, so two runs displacing one cell concurrently are not modelled and a store write is a read-modify-write
      - The model uses exact Int values while the store would keep a SQLite REAL
      - S2 constrains only a cell's best, and eviction_can_destroy_the_population shows a policy satisfying it while destroying the population carry:'elites' needs
      - No records-store table or write path exists yet
  PR-RECORDS-002:
    statement: A vector objective admits no monotone best because Pareto domination has incomparable pairs, so the strongest available property is that no front member is lost except to a dominator.
    status: proved-in-abstract-model
    theorems:
      - Proteus.Exploration.Records.someStrictlyBetter_irrefl
      - Proteus.Exploration.Records.dominates_irrefl
      - Proteus.Exploration.Records.dominates_admits_incomparable
      - Proteus.Exploration.Records.single_component_is_argmax
