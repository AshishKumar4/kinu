    statement: The exploration bonus selectNode ranks by is ordered exactly as natural powers, falls strictly with a node's own visits from one visit on and rises strictly with its parent's visits from two on, ties on the max(1) and max(2) plateaus, rises at the self-parenting root from two visits to three, and the argmax returns an eligible row that no eligible row outranks.
