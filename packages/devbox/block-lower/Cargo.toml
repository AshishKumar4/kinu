[package]
name = "devbox-block-lower"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
