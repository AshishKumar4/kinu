<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Run Kinu agents with files, tools, and memory in the cloud or on your machine. Build live apps, learn from feedback, and compare approaches with executable verifiers." />
    <link rel="icon" type="image/svg+xml" href="/assets/kinu-icon.svg" />
    <title>Kinu · the self-evolving agent platform</title>
    <link rel="preload" href="/assets/fonts/schibsted-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fragmentmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const mode = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.mode = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="landing-root"></div>
    <script type="module" src="/src/landing.tsx"></script>
  </body>
</html>
