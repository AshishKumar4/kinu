  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

gn-items:center; gap:14px; }\n.tui-working { display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border:1px solid rgba(224,164,88,.32); border-radius:999px; color:#E0A458; background:rgba(224,164,88,.06); }\n.tui-working::before { content:''; width:6px; height:6px; border:2px solid rgba(224,164,88,.28); border-top-color:#E0A458; border-radius:50%; animation:tui-spin 1s linear infinite; }\n@keyframes tui-spin { to { transform:rotate(360deg); } }\n.tui-layout { display:grid; grid-template-columns:190px minmax(0,1fr); min-height:420px; }\n.tui-sessions { padding:16px 12px; border-right:1px solid #1F1A15; background:#100E0C; }\n.tui-rail-label { margin:0 8px 12px; color:#6E655B; font:10px/1.4 'Fragment Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }\n.tui-session { padding:9px 10px; border-radius:8px; color:#A69A8B; font-size:12px; }\n.tui-session.active { border-left:2px solid #E0A458; background:#1B1713; color:#E5DDD0; }\n.tui-main { min-width:0; display:flex; flex-direction:column; padding:22px 26px 14px; font:12px/1.65 'Fragment Mono',monospace; }\n.tui-user { align-self:flex-end; max-width:74%; padding:9px 13px; border:1px solid #3A3126; border-radius:12px 12px 3px 12px; background:#241E16; color:#E5DDD0; font-family:'Schibsted Grotesk',sans-serif; font-size:13px; }\n.tui-thought { margin:20px 0 14px; padding-left:12px; border-left:2px solid #332C23; color:#8A7F72; }\n.tui-tools { overflow:hidden; border:1px solid #262019; border-radius:10px; background:#131110; }\n.tui-tool { display:grid; grid-template-columns:120px minmax(0,1fr) auto; gap:14px; padding:9px 12px; color:#8A7F72; }\n.tui-tool + .tui-tool { border-top:1px dashed #2A241D; }\n.tui-tool strong { color:#D8CFC2; font-weight:400; }\n.tui-tool em { color:#8FBC8B; font-style:normal; }\n.tui-answer { margin:17px 0 20px; color:#E5DDD0; font-family:'Schibsted Grotesk',sans-serif; font-size:13.5px; line-height:1.65; }\n.tui-input { margin-top:auto; padding:11px 13px; border:1p " style-hover=\"color:#EDE5D8\">Clients<\u002Fa>\n        <a href=\"#evolution\" style=\"font-size:13px; color:#A69A8B; padding:7px 12px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"color:#EDE5D8\">Evolution<\u002Fa>\n        <a href=\"#swarm\" style=\"font-size:13px; color:#A69A8B; padding:7px 12px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"color:#EDE5D8\">Swarms<\u002Fa>\n        <a href=\"#deploy\" style=\"font-size:13px; color:#A69A8B; padding:7px 12px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"color:#EDE5D8\">Self-host<\u002Fa>\n        <a href=\"https://github.com/AshishKumar4/kinu\" target=\"_blank\" style=\"font-size:13px; color:#A69A8B; padding:7px 12px; border-radius:999px; margin-right:6px\" style-hover=\"color:#EDE5D8\">GitHub ↗<\u002Fa>\n        <a href=\"/login\" style=\"background:#E0A458; color:#1A1408; font-size:13px; font-weight:600; padding:8px 18px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"background:#E3D2AE; color:#1A1408; transform:translateY(-1px)\">Try cloud agents<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"top\" data-screen-label=\"Hero\" style=\"position:relative; overflow:hidden\">\n    <canvas ref=\"{{ canvasRef }}\" style=\"position:absolute; top:4%; right:max(24px, calc(50% - 620px + 40px)); width:min(38%, 480px); height:92%; display:block; pointer-events:none; -webkit-mask-image:radial-gradient(ellipse 78% 82% at 58% 50%, #000 44%, transparent 86%); mask-image:radial-gradient(ellipse 78% 82% at 58% 50%, #000 44%, transparent 86%)\"><\u002Fcanvas>\n    <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse 46% 50% at 84% 46%, rgba(224,164,88,0.07), transparent 72%); pointer-events:none\"><\u002Fdiv>\n    <div class=\"site-shell\" style=\"max-width:1240px; margin:0 auto; padding:0 40px; position:relative\">\n      <div style=\"padding:104px 0 96px 0; max-width:640px\">\n        <div style=\"display:inline-flex; align-items:center; gap:8px; border:1px solid #262019; background:#181512; border-radius:999px; padding:6px 14px; font-size:12px; color:#B5A996; margin-bottom:28px\">\n          <span style=\"width:5px; height:5px; border-radius:50%; background:#E0A458; display:inline-block\"><\u002Fspan>\n          The self-evolving agent platform\n        <\u002Fdiv>\n        <h1 style=\"font-weight:600; font-size:clamp(40px, 5.6vw, 72px); line-height:0.99; letter-spacing:-.04em; margin:0 0 24px 0; text-wrap:pretty\">Agents that {{ heroPhrase }}<\u002Fh1>\n        <p style=\"font-size:17.5px; line-height:1.65; color:#A69A8B; margin:0 0 32px 0; max-width:520px; text-wrap:pretty\">Persistent workspaces with files, sessions, and memory. Hosted on Cloudflare, so tasks keep running after you close the laptop — or fully native on your machine, in the terminal or your editor.<\u002Fp>\n        <div style=\"border:1px solid #262019; background:#131110; border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:540px\">\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; white-space:nowrap; overflow:hidden; min-width:0; text-overflow:ellipsis; color:#D8CFC2\"><span style=\"color:#E0A458\">$<\u002Fspan> <span data-install-command>{{ installCommand }}<\u002Fspan><\u002Fdiv>\n          <button type=\"button\" aria-label=\"Copy install command\" sc-camel-on-click=\"{{ copyInstall }}\" style=\"font-family:inherit; font-size:12px; font-weight:600; color:#8A7F72; cursor:pointer; border:1px solid #262019; background:transparent; padding:5px 12px; border-radius:999px; flex-shrink:0\" style-hover=\"color:#E0A458; border-color:#E0A458\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px; margin-top:22px; align-items:center; flex-wrap:wrap\">\n          <a href=\"/login\" style=\"background:#E0A458; color:#1A1408; font-size:13.5px; font-weight:600; padding:11px 22px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"background:#E3D2AE; color:#1A1408; transform:translateY(-1px)\">Try cloud agents →<\u002Fa>\n          <a href=\"#deploy\" style=\"border:1px solid #332C23; color:#EDE5D8; font-size:13.5px; font-weight:500; padding:10px 22px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"border-color:#E0A458; color:#E0A458; transform:translateY(-1px)\">Deploy your own<\u002Fa>\n          <span style=\"font-size:12.5px; color:#6E655B\">MIT · open source<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"site-shell\" style=\"max-width:1240px; margin:0 auto; padding:0 40px\">\n\n    <div class=\"feature-strip\" style=\"border-top:1px solid #1F1A15; border-bottom:1px solid #1F1A15; display:grid; grid-template-columns:repeat(4,1fr); gap:0; padding:32px 0\">\n      <div style=\"padding-right:28px\">\n        <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:8px\">Learns from use<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.6; color:#A69A8B\">Every turn is graded against your next message. Lessons that later turns confirm persist.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:1px dashed #221D18; padding-left:28px\">\n        <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:8px\">Crafts its own tools<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.6; color:#A69A8B\">Recurring patterns become tools it builds, scores, and calls on its own.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:1px dashed #221D18; padding-left:28px\">\n        <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:8px\">Commands agent swarms<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.6; color:#A69A8B\">A hard task forks a scored tree of whole agents. The best attempt wins.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:1px dashed #221D18; padding-left:28px\">\n        <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:8px\">Your cloud, or yours alone<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.6; color:#A69A8B\">Run it on kinu.run today, or deploy the same Worker into your own account.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"Workspace mock\" style=\"padding:96px 0 0 0\">\n      <div style=\"text-align:center; max-width:620px; margin:0 auto 44px auto\">\n        <h2 style=\"font-weight:600; font-size:clamp(28px,3.2vw,40px); line-height:1.06; letter-spacing:-.03em; margin:0 0 12px 0; text-wrap:pretty\">Every run leaves a clear record.<\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.6; color:#A69A8B; margin:0\">See each file change, running job, and tool the agent creates. When it needs a decision, it asks you here.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n      <div style=\"position:absolute; inset:-8% -4% -14% -4%; background:radial-gradient(ellipse 60% 60% at 50% 40%, rgba(224,164,88,0.07), transparent 72%); pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:relative; border:1px solid #2A241D; border-radius:16px; overflow:hidden; background:#0F0D0B; box-shadow:0 40px 110px -50px rgba(0,0,0,.95)\">\n        <div style=\"height:46px; border-bottom:1px solid #1F1A15; background:#131110; display:flex; align-items:center; justify-content:space-between; padding:0 16px\">\n          <div style=\"display:flex; align-items:center; gap:12px\" 002Fspan>\n              <span style=\"font-size:12.5px; font-weight:600; flex:1\">Jarvis<\u002Fspan>\n              <span style=\"font-size:10.5px; color:#6E655B\">4h<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin:2px 0 0 18px; padding-left:9px; border-left:1px solid #262019\">\n              <div style=\"display:flex; justify-content:space-between; padding:5px 8px\"><span style=\"font-size:12px; color:#D8CFC2\">Scout<\u002Fspan><span style=\"font-size:10px; color:#6E655B\">research<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; padding:5px 8px\"><span style=\"font-size:12px; color:#D8CFC2\">Sentry<\u002Fspan><span style=\"font-size:10px; color:#6E655B\">PR review<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; margin-top:6px\">\n              <span style=\"width:5px; height:5px; border-radius:50%; background:#3A332B; display:inline-block\"><\u002Fspan>\n              <span style=\"font-size:12.5px; color:#A69A8B; flex:1\">checkout-svc<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; border-right:1px solid #1F1A15; min-width:0\">\n            <div style=\"flex:1; padding:20px 24px; display:flex; flex-direction:column; gap:14px; overflow:hidden\">\n              <div style=\"align-self:flex-end; max-width:76%; background:#241E16; border:1px solid #3A3126; border-radius:12px; padding:10px 14px; font-size:13px; line-height:1.55\">Find the slowest test in this repo and explain why.<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:9px; font-size:12px; color:#8A7F72\">\n                <span style=\"color:#6E655B\">▸<\u002Fspan>\n                <span style=\"font-family:'Fragment Mono',monospace; font-size:11.5px; color:#B5A996\">run · laptop<\u002Fspan>\n                <span style=\"font-family:'Fragment Mono',monospace; font-size:11.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">time bun test<\u002Fspan>\n                <span style=\"font-size:11px; color:#8FBC8B\">7 pass · 912 ms<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:9px; font-size:12px; color:#8A7F72\">\n                <span style=\"color:#6E655B\">▸<\u002Fspan>\n                <span style=\"font-family:'Fragment Mono',monospace; font-size:11.5px; color:#B5A996\">agents · swarm<\u002Fspan>\n                <span style=\"font-family:'Fragment Mono',monospace; font-size:11.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">optimise · 3 branches<\u002Fspan>\n                <span style=\"font-size:11px; color:#E0A458\">detached<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px; line-height:1.65; color:#E5DDD0\"><span style=\"font-weight:600\">summary.test.ts<\u002Fspan> takes ~864 ms of the suite's ~912 ms. The dedupe pass is O(n²) — each doubling quadruples runtime. Fix: dedupe with a Map keyed by id, one pass.<\u002Fdiv>\n              <div style=\"border:1px solid rgba(224,164,88,.25); background:rgba(224,164,88,.05); border-radius:12px; padding:10px 14px; font-size:12.5px; line-height:1.55; color:#B5A996\"><span style=\"color:#E0A458; font-weight:600\">System<\u002Fspan> · a background job settled while you were away and was spliced into this turn.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #1F1A15; background:#131110; padding:12px 16px\">\n              <div style=\"border:1px solid #332C23; background:#0B0A09; border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px\">\n                <span style=\"font-size:13px; color:#6E655B; flex:1\">Send a message…<\u002Fspan>\n                <span style=\"font-size:11.5px; color:#8A7F72; border:1px solid #262019; border-radius:999px; padding:3px 10px\">Auto<\u002Fspan>\n                <span style=\"font-size:11.5px; font-weight:600; background:#E0A458; color:#1A1408; border-radius:999px; padding:4px 12px\">Send<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#131110; display:flex; flex-direction:column; min-width:0\">\n            <div style=\"display:flex; gap:10px; padding:12px 14px 0 14px; border-bottom:1px solid #1F1A15\">\n              <span style=\"font-size:11.5px; font-weight:600; color:#E0A458; padding-bottom:9px; border-bottom:2px solid #E0A458\">Work<\u002Fspan>\n              <span style=\"font-size:11.5px; color:#8A7F72; padding-bottom:9px\">Exploration<\u002Fspan>\n              <span style=\"font-size:11.5px; color:#8A7F72; padding-bottom:9px\">Agent<\u002Fspan>\n              <span style=\"font-size:11.5px; color:#8A7F72; padding-bottom:9px\">Files<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:14px; display:flex; flex-direction:column; gap:14px; overflow:hidden\">\n              <div style=\"border:1px solid rgba(224,164,88,.3); background:#181512; border-radius:12px; overflow:hidden\">\n                <div style=\"padding:9px 14px; border-bottom:1px dashed #2A241D; font-size:11.5px; font-weight:600; color:#E0A458\">Needs you · 1<\u002Fdiv>\n                <div style=\"padding:11px 14px\">\n                  <div style=\"font-size:12.5px; color:#E5DDD0; margin-bottom:8px\">Swarm search stopped early<\u002Fdiv>\n                  <div style=\"display:flex; gap:8px\">\n                    <span style=\"font-size:11px; font-weight:600; color:#E0A458; border:1px solid rgba(224,164,88,.35); border-radius:999px; padding:3px 10px\">Retry<\u002Fspan>\n                    <span style=\"font-size:11px; color:#6E655B; border:1px solid #262019; border-radius:999px; padding:3px 10px\">Dismiss<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px; font-weight:600; color:#8A7F72; margin-bottom:8px\">Journal<\u002Fdiv>\n                <div style=\"border:1px solid #262019; background:#181512; border-radius:12px; overflow:hidden\">\n                  <div style=\"display:flex; gap:9px; padding:9px 14px; border-bottom:1px dashed #2A241D; align-items:baseline\"><span style=\"color:#E0A458; font-size:10px\">◈<\u002Fspan><span style=\"font-size:12px; color:#E5DDD0; flex:1\">Crafted a tool: dedupe-bench<\u002Fspan><span style=\"font-size:10px; color:#6E655B\">2m<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:9px; padding:9px 14px; border-bottom:1px dashed #2A241D; align-items:baseline\"><span style=\"color:#8A7F72; font-size:10px\">✓<\u002Fspan><span style=\"font-size:12px; color:#A69A8B; flex:1\">Graded 2 turns<\u002Fspan><span style=\"font-size:10px; color:#6E655B\">18h<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:9px; padding:9px 14px; align-items:baseline\"><span style=\"color:#8A7F72; font-size:10px\">✓<\u002Fspan><span style=\"font-size:12px; color:#A69A8B; flex:1\">Mapped 7 packages<\u002Fspan><span style=\"font-size:10px; color:#6E655B\">19h<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:10px\">\n                <span style=\"font-size:11px; color:#6E655B; white-space:nowrap\">612 MB<\u002Fspan>\n                <div style=\"flex:1; height:4px; background:#262019; border-radius:999px; overflow:hidden\"><div style=\"width:6%; height:100%; background:#E0A458\"><\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:11px; color:#8A7F72; white-space:nowrap\">10 GB<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n\n\n    <div data-screen-label=\"TUI mock\" style=\"padding:96px 0 8px 0\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr); gap:52px; align-items:end; margin-bottom:36px\" class=\"two-grid\">\n        <div>\n          <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:14px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block\"><\u002Fspan>The terminal<\u002Fdiv>\n          <h2 style=\"font-weight:600; font-size:clamp(28px,3.2vw,40px); line-height:1.06; letter-spacing:-.03em; margin:0 0 12px 0; text-wrap:pretty\">The same workspace, <span style=\"color:#E0A458\">without the browser.<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.65; color:#A69A8B; margin:0; max-width:580px\">Open the full-screen TUI over SSH or on your own machine. It keeps the same sessions, tools, background work, and approvals.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <div style=\"position:absolute; inset:-12% -5%; background:radial-gradient(ellipse 58% 70% at 52% 52%, rgba(224,164,88,.065), transparent 72%); pointer-events:none\"><\u002Fdiv>\n        <div class=\"tui-mock\" aria-label=\"Kinu terminal interface preview\">\n          <div class=\"tui-top\">\n            <div class=\"tui-top-group\"><span class=\"site-wordmark compact\"><svg class=\"site-wordmark-mark\" aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M 11.52 2.1 Q 15.72 4.7 18.65 9.58 Q 16.33 16.2 5.18 21.4 L 4.42 20.6 Q 14.07 13.8 15.35 9.62 Q 13.08 7.7 8.88 5.1 Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><span class=\"site-wordmark-name\">Kinu<\u002Fspan><\u002Fspan><span>checkout<\u002Fspan><span class=\"tui-working\">Working<\u002Fspan><\u002Fdiv>\n            <div class=\"tui-top-group\"><span>local<\u002Fspan><span>Claude Opus 4<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tui-layout\">\n            <aside class=\"tui-sessions\">\n              <div class=\"tui-rail-label\">Sessions<\u002Fdiv>\n              <div class=\"tui-session active\">checkout audit<\u002Fdiv>\n              <div class=\"tui-session\">migration review<\u002Fdiv>\n              <div class=\"tui-session\">release notes<\u002Fdiv>\n            <\u002Faside>\n            <div class=\"tui-main\">\n              <div class=\"tui-user\">Audit the checkout flow, fix the coupon failure, and keep the tests green.<\u002Fdiv>\n              <div class=\"tui-thought\">Thinking · I found the request path. I will reproduce the failure before I change the handler.<\u002Fdiv>\n              <div class=\"tui-tools\">\n                <div class=\"tui-tool\"><strong>run · workspace<\u002Fstrong><span>bun test coupon<\u002Fspan><em>7 pass<\u002Fem><\u002Fdiv>\n                <div class=\"tui-tool\"><strong>file<\u002Fstrong><span>Edited 0042_coupon_kind.sql<\u002Fspan><em>saved<\u002Fem><\u002Fdiv>\n                <div class=\"tui-tool\"><strong>agents<\u002Fstrong><span>Delegated three independent checks<\u002Fspan><em>running<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"tui-answer\">The migration only filled fixed coupons. I patched the backfill, added the percentage case, and started the focused suite.<\u002Fdiv>\n              <div class=\"tui-input\">Send a message…<\u002Fdiv>\n              <div class=\"tui-status\"><span>Auto · workspace connected<\u002Fspan><span>ctrl+k commands · esc cancel<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"platform\" data-screen-label=\"01 The platform\" style=\"padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>01 · The platform<\u002Fdiv>\n      <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; max-width:780px; text-wrap:pretty\">Close the laptop. <span style=\"color:#E0A458\">The agent keeps working.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; max-width:660px; margin:0 0 40px 0; text-wrap:pretty\">Kinu is a cloud-native agent platform on Cloudflare — workspaces and sandboxes are hosted, so a task you start keeps running after you close the browser. And the same agent runs fully native on your own machine.<\u002Fp>\n      <div class=\"two-grid\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:30px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:12px\">In the cloud<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:21px; letter-spacing:-.02em; margin-bottom:10px\">Hosted workspaces and sandboxes<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.7; color:#A69A8B\">Start a task, shut your computer, come back to the result. Agents live in Durable Objects and keep working in the background. Schedules and webhooks reach them while you're away.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:30px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:12px\">On your machine<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:21px; letter-spacing:-.02em; margin-bottom:10px\">TUI, CLI, or your editor<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.7; color:#A69A8B\">Run it fully native and local: a full-screen TUI, a one-shot CLI, or inside your editor over ACP. The TUI also connects to your cloud agents — the terminal replaces the web UI whenever you prefer it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #262019; background:#131110; border-radius:12px; padding:16px 24px; font-size:12.5px; color:#8A7F72; margin-bottom:40px\">One backend-agnostic core runs both.<\u002Fdiv>\n      <div class=\"three-grid\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Research, overnight<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Hand it a question in the evening. The brief, with sources, is waiting in the morning.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">PRs reviewed in the background<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">A webhook wakes the agent on every pull request. The review is posted by the time you look.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">PRs created while you're away<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Describe the change. The agent branches, builds, tests, and opens the pull request.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"quickstart\" data-screen-label=\"02 Quickstart\" style=\"border-top:1px solid #1F1A15; padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>02 · Quickstart<\u002Fdiv>\n      <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; max-width:800px; text-wrap:pretty\">Start in the cloud, <span style=\"color:#E0A458\">or entirely on your own machines.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; max-width:620px; margin:0 0 40px 0; text-wrap:pretty\">Both are the same core. Reach one workspace from the web app, the TUI, or the CLI.<\u002Fp>\n      <div class=\"three-grid\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-size:12px; color:#6E655B\">In the browser<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:20px; letter-spacing:-.02em\">Web<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B; flex:1\">Sign in and create a workspace. Nothing to install, and the same workspace opens from every client.<\u002Fdiv>\n          <a href=\"/login\" style=\"font-size:13px; font-weight:600\">Sign in →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-size:12px; color:#6E655B\">In the terminal<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:20px; letter-spacing:-.02em\">TUI<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B; flex:1\"><span style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#E5DDD0\">kinu chat<\u002Fspan> opens the full-screen app: pick a workspace, talk, and watch it work.<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; background:#131110; border:1px solid #262019; border-radius:10px; padding:10px 14px; color:#B5A996\"><span style=\"color:#E0A458\">$<\u002Fspan> kinu chat triage<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-size:12px; color:#6E655B\">In the terminal<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:20px; letter-spacing:-.02em\">CLI<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B; flex:1\">One command installs kinu on macOS or Linux. Create a workspace, then hand it a task.<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; background:#131110; border:1px solid #262019; border-radius:10px; padding:10px 14px; line-height:1.9; color:#B5A996\"><span style=\"color:#E0A458\">$<\u002Fspan> <span data-install-command>{{ installCommand }}<\u002Fspan><br><span style=\"color:#E0A458\">$<\u002Fspan> kinu create triage<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; color:#6E655B; margin:24px 0 0 0\">A workspace created anywhere opens from the others, with its files, sessions, and search history intact.<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"clients\" data-screen-label=\"03 Clients\" style=\"border-top:1px solid #1F1A15; padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>03 · One workspace, every client<\u002Fdiv>\n      <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; max-width:820px; text-wrap:pretty\">Work from the browser, the terminal, <span style=\"color:#E0A458\">or your editor.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; max-width:660px; margin:0 0 40px 0; text-wrap:pretty\">Every client opens the same workspace, with the same files and history. Start a run at your desk, check it over SSH from the terminal, read the result in your editor.<\u002Fp>\n      <div class=\"four-grid\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">The browser<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">kinu.run shows your workspaces: files, sessions, and every search they have run.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">The terminal<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\"><span style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#E5DDD0\">kinu chat<\u002Fspan> opens a conversation. <span style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#E5DDD0\">kinu run<\u002Fspan> executes one task and exits, for scripts and CI.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Your editor<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\"><span style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#E5DDD0\">kinu acp<\u002Fspan> speaks the Agent Client Protocol, so editors like Zed can drive a workspace from a panel.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px; transition:transform .2s ease, border-color .2s ease\" style-hover=\"border-color:#3A3126; transform:translateY(-2px)\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Webhooks<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">A signed webhook starts a turn from CI, an issue tracker, or another service.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #262019; background:#131110; border-radius:14px; padding:22px 26px\">\n        <div style=\"display:flex; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px\">\n          <span style=\"font-size:12px; color:#6E655B\">Recorded — <span style=\"font-family:'Fragment Mono',monospace; font-size:11.5px\">kinu run<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:12px; color:#6E655B\">workspace \"film\" · local backend<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; line-height:2; color:#A69A8B\">\n          <span style=\"color:#E0A458\">$<\u002Fspan> kinu run film <span style=\"color:#E3D2AE\">\"Find the slowest test in this repo and explain why it is slow.\"<\u002Fspan><br>\n          <span style=\"color:#6E655B\">▸ run · laptop<\u002Fspan> time bun test&nbsp;&nbsp;<span style=\"color:#6E655B\">— 7 pass · <span style=\"color:#8FBC8B\">912 ms<\u002Fspan><\u002Fspan><br>\n          <span style=\"color:#6E655B\">▸ run · laptop<\u002Fspan> bun test tests/summary.test.ts&nbsp;&nbsp;<span style=\"color:#6E655B\">— 2 pass · <span style=\"color:#8FBC8B\">864 ms<\u002Fspan><\u002Fspan><br>\n          <span style=\"color:#6E655B\">▸ bench<\u002Fspan> n=6000 dedupe=43.8ms · n=12000 <span style=\"color:#E3D2AE\">188.3ms<\u002Fspan> · n=24000 <span style=\"color:#E3D2AE\">827.3ms<\u002Fspan><br>\n          <span style=\"color:#E5DDD0\">Slowest test<\u002Fspan> — summary.test.ts, ~864 ms of the suite's ~912 ms. dedupe is O(n²): each doubling quadruples runtime. Fix: dedupe with a Map keyed by id — one pass, O(n).<br>\n          <span style=\"color:#6E655B\">@cf/deepseek-ai/deepseek-v4-pro-0813 · 10 steps · 264 s<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; color:#6E655B; margin:24px 0 0 0\">Schedules, webhooks, and finished background jobs start turns the same way.<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"evolution\" data-screen-label=\"04 Self-evolution\" style=\"border-top:1px solid #1F1A15; padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>04 · Self-evolution<\u002Fdiv>\n      <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; max-width:760px; text-wrap:pretty\">Evolution <span style=\"color:#E0A458\">on four timescales.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; max-width:640px; margin:0 0 40px 0; text-wrap:pretty\">The shorter clocks feed the longer ones. None of it needs your upkeep: scoring, consolidation, and retirement run inside the workspace.<\u002Fp>\n      <div class=\"four-grid\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px\">\n          <div style=\"font-size:11.5px; color:#6E655B; margin-bottom:14px\">Per step · every settled tool call<\u002Fdiv>\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Tool fitness<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Crafted tools are scored every time they run. Tools that keep failing drop out of the callable set mid-run.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px\">\n          <div style=\"font-size:11.5px; color:#6E655B; margin-bottom:14px\">Per turn · the next message<\u002Fdiv>\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Turn review<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Each turn is graded against your next message. A lesson persists only when later turns corroborate it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px\">\n          <div style=\"font-size:11.5px; color:#6E655B; margin-bottom:14px\">Per session · every five turns<\u002Fdiv>\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Consolidation<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Recurring patterns become reusable tools, and the agent can propose changes to its own loop. Proposals pass four structural gates and a shadow eval before they land.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:26px\">\n          <div style=\"font-size:11.5px; color:#6E655B; margin-bottom:14px\">Per lifetime · every five windows<\u002Fdiv>\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Retirement and search<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Tool scores decay with time, and low scores retire the tool. <span style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#E5DDD0\">kinu evolve<\u002Fspan> searches over the loop itself, scored on graded turns.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; color:#6E655B; margin:24px 0 0 0\">Execution evidence feeds tool selection only. Nothing wider is promoted on it.<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"swarm\" data-screen-label=\"05 Tree of agents\" style=\"border-top:1px solid #1F1A15; padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>05 · The tree of agents<\u002Fdiv>\n      <div class=\"two-grid\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start\">\n        <div>\n          <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; text-wrap:pretty\">Run one task <span style=\"color:#E0A458\">as a tree of agents.<\u002Fspan><\u002Fh2>\n          <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; margin:0 0 14px 0; text-wrap:pretty\">One tool call builds the tree. Each node is a whole agent that attempts the task its own way, in its own directory, with its own credential. Weak branches are pruned mid-run, and the winner answers.<\u002Fp>\n          <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; margin:0 0 14px 0; text-wrap:pretty\">The agent turns your ask into an objective: a metric, a target, and a verifier. A verifier is code that runs in the workspace, and its number picks the winner.<\u002Fp>\n          <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; margin:0; text-wrap:pretty\">What you get back is the winner plus the record: every branch, its score, and the verifier number behind each pick. Results persist per objective, so the next search starts from the record instead of from zero.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#131110; border-radius:14px; padding:22px 26px\">\n          <div style=\"font-size:12px; color:#6E655B; margin-bottom:14px\">One call<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; line-height:1.9; color:#A69A8B\">agents({<br>&nbsp;&nbsp;action: <span style=\"color:#E3D2AE\">'swarm'<\u002Fspan>, preset: <span style=\"color:#E3D2AE\">'optimise'<\u002Fspan>,<br>&nbsp;&nbsp;task: <span style=\"color:#E3D2AE\">'make the p95 faster'<\u002Fspan>,<br>&nbsp;&nbsp;objective: {<br>&nbsp;&nbsp;&nbsp;&nbsp;metric: <span style=\"color:#E3D2AE\">'p95_latency'<\u002Fspan>, unit: <span style=\"color:#E3D2AE\">'ms'<\u002Fspan>,<br>&nbsp;&nbsp;&nbsp;&nbsp;direction: <span style=\"color:#E3D2AE\">'down'<\u002Fspan>, target: <span style=\"color:#8FBC8B\">120<\u002Fspan>,<br>&nbsp;&nbsp;&nbsp;&nbsp;verifier: <span style=\"color:#E0A458\">'bench.p95'<\u002Fspan>&nbsp;<span style=\"color:#6E655B\">// code, not a judge<\u002Fspan><br>&nbsp;&nbsp;}<br>})<\u002Fdiv>\n          <div style=\"border-top:1px dashed #2A241D; margin-top:16px; padding-top:14px; font-size:13px; line-height:1.7; color:#8A7F72\">The shape follows the scenario: <span style=\"color:#E0A458\">ideate<\u002Fspan> fans flat, <span style=\"color:#E0A458\">optimise<\u002Fspan> climbs with UCT, <span style=\"color:#E0A458\">prove<\u002Fspan> goes deepest, <span style=\"color:#E0A458\">research · audit · redteam<\u002Fspan> cover a scored grid.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"deploy\" data-screen-label=\"06 Self-host\" style=\"border-top:1px solid #1F1A15; padding:104px 0 96px 0\">\n      <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>06 · Self-host<\u002Fdiv>\n      <div class=\"two-grid\" style=\"display:grid; grid-template-columns:1fr 1.12fr; gap:56px; align-items:start; margin-bottom:20px\">\n        <div>\n          <h2 style=\"font-weight:600; font-size:clamp(30px,3.4vw,44px); line-height:1.06; letter-spacing:-.03em; margin:0 0 14px 0; text-wrap:pretty\">Host Kinu agents <span style=\"color:#E0A458\">yourself.<\u002Fspan><\u002Fh2>\n          <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; margin:0 0 28px 0; text-wrap:pretty\">The whole cloud platform deploys into your own Cloudflare account, backed by Durable Objects. Your agents, files, and model spend stay with you.<\u002Fp>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap\">\n            <a href=\"https://deploy.workers.cloudflare.com/?url=https://github.com/AshishKumar4/kinu\" target=\"_blank\" style=\"background:#E0A458; color:#1A1408; font-size:13.5px; font-weight:600; padding:11px 22px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"background:#E3D2AE; color:#1A1408; transform:translateY(-1px)\">Deploy to Cloudflare →<\u002Fa>\n            <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/SELF-HOSTING.md\" target=\"_blank\" style=\"border:1px solid #332C23; color:#EDE5D8; font-size:13.5px; font-weight:500; padding:10px 22px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"border-color:#E0A458; color:#E0A458; transform:translateY(-1px)\">Self-hosting guide<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; overflow:hidden\">\n          <div style=\"display:grid; grid-template-columns:96px 1fr; gap:18px; padding:20px 26px; border-bottom:1px dashed #2A241D; align-items:baseline\">\n            <div style=\"font-size:12px; color:#6E655B\">Step one<\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px; line-height:1.6; color:#A69A8B\"><span style=\"color:#E5DDD0; font-weight:600\">Bring the account.<\u002Fspan> Workers Paid plan, a zone, a wrangler login. Provisioning prints everything it cannot create for you.<\u002Fdiv>\n              <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; color:#E0A458; margin-top:8px\">bun run infra:provision<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:96px 1fr; gap:18px; padding:20px 26px; border-bottom:1px dashed #2A241D; align-items:baseline\">\n            <div style=\"font-size:12px; color:#6E655B\">Step two<\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px; line-height:1.6; color:#A69A8B\"><span style=\"color:#E5DDD0; font-weight:600\">Deploy, then provision again.<\u002Fspan> The deploy ships the Worker, its Durable Objects and its container. Secrets install on a Worker that exists.<\u002Fdiv>\n              <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; color:#E0A458; margin-top:8px\">bun run deploy<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:96px 1fr; gap:18px; padding:20px 26px; align-items:baseline\">\n            <div style=\"font-size:12px; color:#6E655B\">Step three<\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px; line-height:1.6; color:#A69A8B\"><span style=\"color:#E5DDD0; font-weight:600\">Prove the account.<\u002Fspan> The infra gate checks every declared resource exists and the deployed Worker is bound to it. It exits non-zero when one is not.<\u002Fdiv>\n              <div style=\"font-family:'Fragment Mono',monospace; font-size:12px; color:#E0A458; margin-top:8px\">bun run gate:infra<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"four-grid\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px\">\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Isolated workspaces<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Each workspace is a Durable Object with its own files and sessions. Idle workspaces use no compute; stored data still uses storage.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">10 GB file plane, each<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Each paid-plan workspace can keep up to 10 GB of durable files and shell state.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">True Linux on demand<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">When an agent needs one, it attaches a full Linux sandbox on Cloudflare Containers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #262019; background:#181512; border-radius:14px; padding:24px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#E0A458; margin-bottom:10px\">Your own devices<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.65; color:#A69A8B\">Connect your PC and your agents can use it too — every access behind your consent.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; color:#6E655B; margin:24px 0 0 0\">When the infra gate passes, the Worker serving your requests is the same one kinu.run runs.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"cta\" data-screen-label=\"07 Open source\" style=\"border-top:1px solid #1F1A15; background:linear-gradient(180deg, #181512 0%, #0F0D0B 100%)\">\n    <div class=\"site-shell two-grid\" style=\"max-width:1240px; margin:0 auto; padding:100px 40px; display:grid; grid-template-columns:1.2fr 1fr; gap:56px; align-items:center\">\n      <div>\n        <div style=\"font-size:13px; font-weight:600; color:#E0A458; margin-bottom:16px; display:flex; align-items:center; gap:12px\"><span style=\"width:22px; height:1px; background:rgba(224,164,88,.55); display:inline-block; flex-shrink:0\"><\u002Fspan>07 · Open source<\u002Fdiv>\n        <h2 style=\"font-weight:600; font-size:clamp(32px,3.8vw,48px); line-height:1.05; letter-spacing:-.03em; margin:0 0 16px 0; text-wrap:pretty\">Open source, <span style=\"color:#E0A458\">end to end.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; color:#A69A8B; margin:0 0 32px 0; max-width:520px; text-wrap:pretty\">MIT-licensed — the agent, both backends, and the CLI.<\u002Fp>\n        <div style=\"display:flex; gap:12px; flex-wrap:wrap\">\n          <a href=\"https://github.com/AshishKumar4/kinu\" target=\"_blank\" style=\"background:#E0A458; color:#1A1408; font-size:14px; font-weight:600; padding:12px 26px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"background:#E3D2AE; color:#1A1408; transform:translateY(-1px)\">Read the source →<\u002Fa>\n          <a href=\"https://kinu.run\" target=\"_blank\" style=\"border:1px solid #332C23; color:#EDE5D8; font-size:14px; font-weight:500; padding:11px 26px; border-radius:999px; transition:transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease\" style-hover=\"border-color:#E0A458; color:#E0A458; transform:translateY(-1px)\">Try cloud agents<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #262019; background:#131110; border-radius:14px; padding:6px 26px\">\n        <div style=\"display:grid; grid-template-columns:96px 1fr; gap:16px; padding:15px 0; border-bottom:1px dashed #2A241D; align-items:baseline\">\n          <div style=\"font-size:12px; color:#6E655B\">Licence<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#D8CFC2\">MIT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:96px 1fr; gap:16px; padding:15px 0; border-bottom:1px dashed #2A241D; align-items:baseline\">\n          <div style=\"font-size:12px; color:#6E655B\">Source<\u002Fdiv>\n          <a href=\"https://github.com/AshishKumar4/kinu\" target=\"_blank\" style=\"font-family:'Fragment Mono',monospace; font-size:12.5px\">github.com/AshishKumar4/kinu<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:96px 1fr; gap:16px; padding:15px 0; border-bottom:1px dashed #2A241D; align-items:baseline\">\n          <div style=\"font-size:12px; color:#6E655B\">Backends<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; color:#D8CFC2\">Cloudflare Workers · POSIX<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:96px 1fr; gap:16px; padding:15px 0; align-items:baseline\">\n          <div style=\"font-size:12px; color:#6E655B\">Docs<\u002Fdiv>\n          <div style=\"font-family:'Fragment Mono',monospace; font-size:12.5px; display:flex; gap:14px; flex-wrap:wrap\">\n            <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/ARCHITECTURE.md\" target=\"_blank\">architecture<\u002Fa>\n            <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/EXPLORATION.md\" target=\"_blank\">exploration<\u002Fa>\n            <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/EVOLUTION.md\" target=\"_blank\">evolution<\u002Fa>\n            <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/DEPLOYMENT.md\" target=\"_blank\">deployment<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #1F1A15\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:32px 40px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:16px\">\n      <div style=\"display:flex; align-items:baseline; gap:10px\">\n        <span class=\"site-wordmark compact\"><svg class=\"site-wordmark-mark\" aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M 11.52 2.1 Q 15.72 4.7 18.65 9.58 Q 16.33 16.2 5.18 21.4 L 4.42 20.6 Q 14.07 13.8 15.35 9.62 Q 13.08 7.7 8.88 5.1 Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><span class=\"site-wordmark-name\">Kinu<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:12px; color:#6E655B\">絹 · the self-evolving agent platform<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:22px; font-size:13px\">\n        <a href=\"https://github.com/AshishKumar4/kinu\" target=\"_blank\" style=\"color:#A69A8B\" style-hover=\"color:#E0A458\">GitHub<\u002Fa>\n        <a href=\"https://github.com/AshishKumar4/kinu/blob/main/QUICKSTART.md\" target=\"_blank\" style=\"color:#A69A8B\" style-hover=\"color:#E0A458\">Quickstart<\u002Fa>\n        <a href=\"https://github.com/AshishKumar4/kinu/blob/main/docs/USER-GUIDE.md\" target=\"_blank\" style=\"color:#A69A8B\" style-hover=\"color:#E0A458\">User guide<\u002Fa>\n        <a href=\"https://kinu.run\" target=\"_blank\" style=\"color:#A69A8B\" style-hover=\"color:#E0A458\">kinu.run<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"font-size:12.5px; color:#6E655B\">MIT © 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { copied: false, phraseI: 0, len: 0, typing: true };\n  phrases = [\n    'get better with use.',\n    'craft their own tools.',\n    'command scored swarms.',\n    'work while you sleep.',\n    'improve their prompts.',\n    'run cloud, or local.'\n  ];\n  componentDidMount() {\n    this.canvasEl = null;\n    this.t0 = performance.now();\n    this.dims = { w: 1440, h: 900 };\n    this.buildTree();\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      this.setState({ len: this.phrases[0].length, typing: false });\n      this.raf = requestAnimationFrame(() => {\n        this.sizeCanvas();\n        this.draw(this.lastAppear + 2200);\n      });\n      return;\n    }\n    const step = () => {\n      const { phraseI, len, typing } = this.state;\n      const p = this.phrases[phraseI];\n      let d = 50;\n      if (typing) {\n        if (len < p.length) { this.setState({ len: len + 1 }); d = 42 + Math.random() * 46; }\n        else { this.setState({ typing: false }); d = 2600; }\n      } else if (len > 0) {\n        this.setState({ len: len - 1 }); d = 20;\n      } else {\n        this.setState({ typing: true, phraseI: (phraseI + 1) % this.phrases.length }); d = 420;\n      }\n      this.phraseTimer = setTimeout(step, d);\n    };\n    this.phraseTimer = setTimeout(step, 700);\n    const loop = (now) => { this.sizeCanvas(); this.draw(now - this.t0); this.raf = requestAnimationFrame(loop); };\n    this.raf = requestAnimationFrame(loop);\n  }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.phraseTimer); }\n  sizeCanvas() {\n    const el = this.canvasEl; if (!el) return;\n    const r = el.getBoundingClientRect();\n    if (r.width < 4 || r.height < 4) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);\n    if (el.width !== w || el.height !== h) {\n      el.width = w; el.height = h;\n      this.dims = { w: r.width, h: r.height };\n      this.dpr = dpr;\n      this.buildTree();\n      this.t0 = performance.now();\n    }\n  }\n  buildTree() {\n    const seed = 40 + Math.floor(Math.random() * 900);\n    const rng = (() => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();\n    const W = this.dims.w, H = this.dims.h, nodes = [];\n    const levels = 6, xL = W * 0.12, xR = W * 0.9;\n    const mk = (parent, depth, yMin, yMax) => {\n      const span = yMax - yMin;\n      const y = yMin + span * (0.34 + rng() * 0.32);\n      const x = xL + (xR - xL) * (depth / (levels - 1)) + (depth ? (rng() - 0.5) * W * 0.03 : 0);\n      const n = { id: nodes.length, parent, depth, x, y, children: [], phase: rng() * 6.28 };\n      nodes.push(n);\n      if (parent !== null) nodes[parent].children.push(n.id);\n      if (depth < levels - 1) {\n        const k = depth === 0 ? 3 : (rng() < 0.46 ? 2 : (rng() < 0.8 ? 3 : 1));\n        for (let i = 0; i < k; i++) {\n          if (depth > 1 && rng() < 0.3) continue;\n          mk(n.id, depth + 1, yMin + i * span / k, yMin + (i + 1) * span / k);\n        }\n      }\n      return n;\n    };\n    mk(null, 0, H * 0.18, H * 0.82);\n    [...nodes].sort((a, b) => a.depth - b.depth || a.y - b.y)\n      .forEach((n, i) => { n.appear = 160 + i * 165 + rng() * 90; });\n    const deep = nodes.filter(n => n.children.length === 0 && n.depth >= levels - 2 && n.y > H * 0.25 && n.y < H * 0.75);\n    const winner = deep.length ? deep[Math.floor(rng() * deep.length)] : nodes[nodes.length - 1];\n    const path = new Set();\n    for (let n = winner; n; n = n.parent === null ? null : nodes[n.parent]) path.add(n.id);\n    this.nodes = nodes; this.winner = winner; this.winPath = path;\n    this.lastAppear = Math.max(...nodes.map(n => n.appear));\n    this.cycle = this.lastAppear + 5600;\n  }\n  draw(tAbs) {\n    const el = this.canvasEl; if (!el) return;\n    const ctx = el.getContext('2d');\n    const W = this.dims.w, H = this.dims.h;\n    const dpr = this.dpr || 1;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    const t = tAbs % this.cycle;\n    if (t < 40 && this.cycled !== Math.floor(tAbs / this.cycle)) {\n      this.cycled = Math.floor(tAbs / this.cycle);\n      if (this.cycled > 0) this.buildTree();\n    }\n    ctx.clearRect(0, 0, W, H);\n    const settleT = this.lastAppear + 700;\n    const winProg = Math.max(0, Math.min(1, (t - settleT) / 1300));\n    const fadeOut = Math.max(0, Math.min(1, (t - (this.cycle - 1000)) / 1000));\n    const alpha = 1 - fadeOut;\n    const sway = (n) => Math.sin(tAbs / 2400 + n.phase) * (1.5 + n.depth * 0.9);\n    for (const n of this.nodes) {\n      if (n.parent === null) continue;\n      const p = this.nodes[n.parent];\n      const ap = Math.min(1, Math.max(0, (t - n.appear) / 700));\n      if (ap <= 0) continue;\n      const e = ap < 1 ? 1 - Math.pow(1 - ap, 3) : 1;\n      const px = p.x, py = p.y + sway(p);\n      const tx = n.x, ty = n.y + sway(n);\n      const ex = px + (tx - px) * e, ey = py + (ty - py) * e;\n      const onPath = this.winPath.has(n.id) && this.winPath.has(p.id);\n      const g = ctx.createLinearGradient(px, py, ex, ey);\n      const base = onPath ? 0.2 + 0.6 * winProg : 0.17;\n      g.addColorStop(0, `rgba(224,164,88,${base * 0.35 * alpha})`);\n      g.addColorStop(1, `rgba(227,210,174,${base * alpha})`);\n      ctx.strokeStyle = g;\n      ctx.lineWidth = onPath ? 0.9 + 0.9 * winProg : 0.85;\n      ctx.beginPath();\n      ctx.moveTo(px, py);\n      const cx = px + (ex - px) * 0.55;\n      ctx.bezierCurveTo(cx, py, px + (ex - px) * 0.45, ey, ex, ey);\n      ctx.stroke();\n    }\n    for (const n of this.nodes) {\n      const ap = Math.min(1, Math.max(0, (t - n.appear) / 620));\n      if (ap <= 0) continue;\n      const x = n.x, y = n.y + sway(n);\n      const isRoot = n.parent === null;\n      const isWin = n.id === this.winner.id;\n      const onPath = this.winPath.has(n.id);\n      const isLeaf = n.children.length === 0;\n      const r = (isRoot ? 5 : isLeaf ? 3.6 : 2.6) * (0.5 + 0.5 * ap);\n      const fresh = t - n.appear;\n      if (fresh < 1600 && fresh > 0) {\n        const k = 1 - fresh / 1600;\n        ctx.beginPath();\n        ctx.arc(x, y, r + 3 + 22 * (1 - k), 0, 7);\n        ctx.fillStyle = `rgba(224,164,88,${0.06 * k * alpha})`;\n        ctx.fill();\n      }\n      if (isWin && winProg > 0) {\n        const halo = ctx.createRadialGradient(x, y, 0, x, y, 62);\n        halo.addColorStop(0, `rgba(224,164,88,${0.22 * winProg * alpha})`);\n        halo.addColorStop(1, 'rgba(224,164,88,0)');\n        ctx.fillStyle = halo;\n        ctx.beginPath(); ctx.arc(x, y, 62, 0, 7); ctx.fill();\n      }\n      ctx.beginPath(); ctx.arc(x, y, isWin ? r * (1 + 0.5 * winProg) : r, 0, 7);\n      if (isWin && winProg > 0.1) ctx.fillStyle = `rgba(240,228,205,${(0.5 + 0.5 * winProg) * alpha})`;\n      else if (onPath && winProg > 0.1) ctx.fillStyle = `rgba(224,164,88,${(0.3 + 0.45 * winProg) * alpha})`;\n      else if (isRoot) ctx.fillStyle = `rgba(227,210,174,${0.6 * alpha})`;\n      else ctx.fillStyle = `rgba(224,164,88,${(isLeaf ? 0.5 : 0.36) * alpha})`;\n      ctx.fill();\n    }\n  }\n  renderVals() {\n    return {\n      installCommand: `curl -fsSL '${window.location.origin}/install.sh' | bash`,\n      copyLabel: this.state.copied ? 'Copied' : 'Copy',\n      heroPhrase: React.createElement('span',\n        { className: 'hero-phrase', style: { display: 'block', height: '1.06em', whiteSpace: 'nowrap', color: '#E0A458' } },\n        this.phrases[this.state.phraseI].slice(0, this.state.len),\n        React.createElement
