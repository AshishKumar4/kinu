<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Persistent agents that work across the web, terminal, and editor — and improve with use." />
    <link rel="icon" type="image/svg+xml" href="/assets/kinu-icon.svg" />
    <title>Kinu — self-evolving agents</title>
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        const mode = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.mode = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="landing-root"></div>
    <script type="module" src="/src/landing.tsx"></script>
  </body>
</html>
