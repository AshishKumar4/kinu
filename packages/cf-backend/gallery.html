<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="kinu-preview-host-suffix" content="preview.example.test" />
    <title>Kinu — Design Gallery</title>
    <link rel="icon" href="/assets/kinu-icon.svg" />
    <link rel="preload" href="/assets/fonts/schibsted-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fragmentmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Same pre-paint resolution as index.html. The browser gates drive the
         mode through `prefers-color-scheme`, so it has to be read here. -->
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const mode = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
