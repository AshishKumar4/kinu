<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="kinu-preview-host-suffix" content="preview.example.test" />
    <title>Kinu — Design Gallery</title>
    <link rel="icon" href="/assets/kinu-icon.svg" />
    <link rel="preload" href="/assets/fonts/inter-latin-opsz.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fragmentmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The mode is painted by core's MODE_BOOT, which vite-theme.ts injects into every page, this one too. The
         gallery stands in for the server, which names an account's theme on the root: `?look=warm` names it here. -->
    <script>
      (() => {
        const look = new URLSearchParams(location.search).get("look");
        // `&background=quiet|none`: the new-workspace page's field under review (AppBackground.tsx).
        const background = new URLSearchParams(location.search).get("background");
        if (look !== null) document.documentElement.setAttribute("data-theme", look);
        if (background !== null) document.documentElement.setAttribute("data-background", background);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
