<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinu — Design Gallery</title>
    <!-- Same pre-paint resolution as index.html, both axes. The browser gates
         drive the mode through `prefers-color-scheme` and the palette through
         seeded localStorage, so both have to be read here. -->
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const mode = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        const saved = localStorage.getItem("palette");
        const palette = saved === "umber" || saved === "silk" ? saved : "silk";
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.setAttribute("data-palette", palette);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
