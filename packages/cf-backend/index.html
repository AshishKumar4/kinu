<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/kinu-icon.svg" />
    <title>Kinu — Self-Evolving Agent</title>
    <!-- Pre-paint theme so the first frame is already the one the user
         chose. Duplicates the resolution in `hooks/use-theme.ts` because it
         has to run before any module loads; the two must agree. -->
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const mode = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
