[install]
linker = "hoisted"

# The security scanner every `bun install` and `bun pm scan` runs through.
#
# Bun ships NO built-in scanner: without this line `bun pm scan` exits 1 with
# `error: no security scanner configured` and an install unpacks 1288 tarballs
# having checked none of them against any advisory feed. This line is what makes
# the check exist; `scripts/dependency-advisory-gate.ts` asserts it is still
# here, because deleting it would turn that gate green over a scan nobody ran.
[install.security]
scanner = "./scripts/security-scanner.ts"

[test]
preload = ["./scripts/test-preload.ts"]

# What `bun test` at the repo root must NOT walk into.
#
# Before this, the most obvious command anyone types — a newcomer, or an agent
# reaching for the broadest check it knows — did not terminate. Measured
# 2026-08-17: killed at 900s having produced 339 failures and 206 errors, none
# of them ours. Bun does not honour .gitignore, so the gitignored external/
# reference clones contributed 2,521 foreign test files against our 400, and any
# real root-level regression was buried in the wall. With these two patterns the
# same command is 4,988 tests across 444 files in 185s.
#
# tools/oxlint/anti-slop is ours and DOES run — under Node, via
# `bun run test:anti-slop`, because oxlint's RuleTester needs Node's raw
# transfer and throws under bun.
#
# packages/*/tests/workerd is ours and DOES run — inside workerd, via
# `bun run test:workerd`. Those files import `cloudflare:workers` and
# `cloudflare:test`, which exist only in the Workers runtime; under bun they are
# 2 instant errors, and `bun test --cwd packages/cf-backend` walks into them.
# This pattern is the LOAD-BEARING HALF of the runner boundary: the other half
# is `packages/cf-backend/vitest.config.ts`, whose `include` is exactly that
# directory. scripts/ladder.test.ts asserts the two globs are disjoint, that
# each selects a non-empty set, and that every excluded file is claimed by some
# other runner. An exclusion nobody asserts is how coverage disappears.
pathIgnorePatterns = [
  "**/external/**",
  "tools/oxlint/anti-slop/**",
  "**/tests/workerd/**",
]
