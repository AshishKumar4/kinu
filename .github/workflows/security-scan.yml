name: Security — Secret Leak Detection

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  pattern-scan:
    name: Custom Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The scanner's own gate. Its patterns, its ignore-file semantics, and the
      # fact that the committed ignore file really does suppress the fixture it
      # names — all asserted before the scan is trusted to gate anything.
      - name: Scanner self-test
        run: bun test scripts/secret-scan.test.ts

      - name: Scan for secret patterns
        run: bun scripts/secret-scan.ts
