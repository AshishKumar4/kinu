name: Security — Secret Leak Detection

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # PINNED TO A COMMIT, not to `@main`. `@main` is the head of a third
      # party's default branch, resolved fresh on every run, so the code this
      # step executes was whatever that branch said at the time — over the full
      # history of this repository, which is where the secrets would be. The sha
      # is release v3.97.1, resolved on 2026-08-27 with
      # `gh api repos/trufflesecurity/trufflehog/git/ref/tags/v3.97.1`.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified

  pattern-scan:
    name: Custom Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The scanner's own gate. Its patterns, its ignore-file semantics, and the
      # fact that the committed ignore file really does suppress the fixture it
      # names — all asserted before the scan is trusted to gate anything.
      - name: Scanner self-test
        run: bun test scripts/secret-scan.test.ts

      - name: Scan for secret patterns
        run: bun scripts/secret-scan.ts
