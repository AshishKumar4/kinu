name: Deploy staging

# Staging is deferred while production is the direct deployment target.
# Manual runs retain the normal deployment gates, asset checks and smoke checks.
# The staging environment still owns its scoped Cloudflare credential.

# The job reads the checkout and nothing else. Without this block the workflow
# inherits whatever the repository's default token permissions happen to be,
# which on a repository created before 2023 is write access to everything —
# handed to a job that also holds a Cloudflare deploy credential.
permissions:
  contents: read

on:
  workflow_dispatch:

# One staging deploy at a time. Two concurrent runs would race on the same Worker
# and the loser's smoke test would read the winner's build stamp, which presents
# as a deploy failure and is not one. `cancel-in-progress` is off on purpose: a
# deploy that has already published wants its smoke test to finish.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deployment boundary GitHub can enforce. `CLOUDFLARE_API_TOKEN` belongs
    # to this environment rather than to the repository, so no other workflow and
    # no other job can read it, and the environment's own branch rule and
    # reviewers decide when a run may use it. OPERATOR SETUP REQUIRED: creating
    # the environment and moving the secret into it is a dashboard action — until
    # it is done, a repository-level secret of the same name still resolves and
    # this line changes nothing.
    environment: staging
    # The declared deploy tier is 400s of gates, and on a 2-core runner the wave
    # runs almost serially. Lean is the long pole: the setup-lean action caches
    # `lean/.lake`, and on a miss `verify:lean` rebuilds 330 theorems in ~15
    # minutes. Generous enough for a cold cache, tight enough that a hung gate
    # fails rather than idles.
    timeout-minutes: 90
    steps:
      # The script refuses a dirty tree and stamps the build with `git rev-parse
      # --short HEAD`; the smoke test reads that sha back off /api/health, so the
      # checkout has to be a real commit rather than an export.
      - uses: actions/checkout@v4
        with:
          # `scripts/deploy.sh` runs `gate:commit-message`, which reads every
          # commit from the convention's boundary to HEAD. The default depth-1
          # checkout has no such range and the gate refuses one. Same setting and
          # same reason as security-scan.yml.
          fetch-depth: 0
          # The deploy reads the tree and `git rev-parse`; it never pushes. A
          # persisted token would sit in `.git/config` for the whole run, inside
          # the job that runs 53 gates' worth of repository code.
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned and checksum-verified, and BEFORE the step that holds the deploy
      # credential — `verify:lean` is one of the deploy's required gates, so this
      # toolchain executes inside it. See .github/actions/setup-lean.
      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Chrome for the four gates that boot vite and drive a real page.
      - name: Install Chrome for puppeteer
        run: bunx puppeteer browsers install chrome

      # THE WHOLE PIPELINE. No step list here, deliberately: a workflow that
      # enumerates gates becomes a second list that disagrees with deploy.sh, and
      # the CI workflow's header records what that cost the last time.
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:staging
