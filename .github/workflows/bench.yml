name: Bench corpus

# The measurement instrument's own integrity check: every bench task's defect must break this
# repository's checks, and reversing it must restore them. It needs no credential and no model,
# so it runs nightly and on demand; the per-push half (every defect patch still applies) is the
# CI workflow's bench step. A pull request's own corpus change is exercised here, with no secret.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    # Runs the repository suite once per task, about 160 times.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate bench corpus
        run: bun scripts/bench.ts validate --run-root "$RUNNER_TEMP/bench"
