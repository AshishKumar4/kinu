name: Evals

# Measures the build kinu.run is serving: every task in evals/tasks, ten trials each, run as the
# eval-service identity against the deployment itself. There is one environment, so a pull request
# cannot be measured before it ships; the comparison is deploy to deploy. scripts/deploy.sh
# dispatches this after a publish, and anyone with write access can dispatch it by hand.
#
# The candidate is the deployed build. The baseline is the latest complete report of an earlier
# deployed build that is an ancestor of it: deploys come several a day and a run takes hours, so it
# is not always the previous deploy. The results comment goes on the pull request that merged the
# deployed commit, else on the commit itself, and a Kinu workspace then posts why the evals failed.
# Earlier comments of either kind on the same pull request or commit are deleted first.
#
# The repository is public. Trials run on eval-service workspaces with seeded data only, and every
# string a trial produced is scrubbed (evals/src/redact.ts) before it is stored or posted.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline build sha. Blank: the latest complete report of an ancestor build.'
        required: false

permissions: {}

# A newer build's run cancels an older one's: its trials would see the deployment change under them.
concurrency:
  group: evals
  cancel-in-progress: true

env:
  EVAL_TRIALS: '10'
  # A task's trials are split across jobs of this many, so no job nears GitHub's 6-hour limit: in
  # the 2026-09-24 pilot a budget-board trial was still in its second turn after 55 minutes, and
  # ten trials at three at a time are four such waves.
  EVAL_TRIALS_PER_JOB: '5'
  # Trials at once per job, and jobs at once: together within what the eval account's Workers AI
  # rate limit sustains (evals/src/config.ts), since more only adds 429 waits.
  EVAL_CONCURRENCY: '3'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      tasks: ${{ steps.tasks.outputs.tasks }}
      jobs: ${{ steps.tasks.outputs.jobs }}
      baseline-sha: ${{ steps.baseline.outputs.sha }}
      baseline-artifact: ${{ steps.baseline.outputs.artifact-id }}
    steps:
      - name: Read the deployed build
        id: build
        run: |
          sha=$(curl -fsS https://kinu.run/api/health | jq -r '.build.sha // empty')
          if [[ ! "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::kinu.run/api/health names no build sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A deploy publishes the local checkout; the commit is only here once someone pushes it.
      - name: Check the build is on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          if ! gh api "repos/$GH_REPO/commits/$SHA" --silent; then
            echo "::error::kinu.run serves build $SHA, which is not on GitHub: push it, then dispatch again"
            exit 1
          fi

      # The deployed commit's own tasks and harness: what was deployed is what is measured.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # One job per task and block of trials: `first` numbers the block's first trial.
      - name: List the tasks
        id: tasks
        run: |
          tasks=$(find evals/tasks -name '*.eval.ts' | sort |
            jq -Rnc '[inputs | {file: ., task: (sub("^evals/tasks/"; "") | sub("\\.eval\\.ts$"; ""))}]')
          jobs=$(jq -c --argjson trials "$EVAL_TRIALS" --argjson per "$EVAL_TRIALS_PER_JOB" '
            [range(0; $trials; $per) | {first: (. + 1), last: ([. + $per, $trials] | min)}
              | . + {count: (.last - .first + 1)}] as $blocks
            | [.[] as $task | $blocks[] | $task + .]' <<<"$tasks")
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Stored complete reports are artifacts named kinu-evals-<sha>-<trials>-per-task.
      - name: Find the baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ steps.build.outputs.sha }}
          REQUESTED: ${{ inputs.baseline }}
        run: |
          stored=$(gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false) | select(.name | test(\"^kinu-evals-[0-9a-f]+-${EVAL_TRIALS}-per-task$\")) | [.created_at, .id, .name] | @tsv" |
            sort -r)
          mapfile -t shas < <(cut -f3 <<<"$stored" | sed -E "s/^kinu-evals-([0-9a-f]+)-.*/\1/" | awk 'NF && !seen[$0]++')
          if [[ -n "$REQUESTED" ]]; then
            baseline=$(printf '%s\n' "${shas[@]}" | grep -x "$REQUESTED" || true)
            if [[ -z "$baseline" ]]; then
              echo "::error::no complete report is stored for build $REQUESTED"
              exit 1
            fi
          else
            baseline=$(bun evals/scripts/baseline.ts "$CANDIDATE" "${shas[@]}")
          fi
          if [[ -n "$baseline" ]]; then
            artifact=$(awk -F'\t' -v name="kinu-evals-$baseline-${EVAL_TRIALS}-per-task" '$3 == name { print $2; exit }' <<<"$stored")
            echo "sha=$baseline" >> "$GITHUB_OUTPUT"
            echo "artifact-id=$artifact" >> "$GITHUB_OUTPUT"
            echo "Baseline: build $baseline (artifact $artifact)"
          else
            echo "No stored report of an earlier build: this run stands alone and becomes the first baseline."
          fi

  evals:
    name: Eval ${{ matrix.task }}, trials ${{ matrix.first }} to ${{ matrix.last }}
    needs: plan
    runs-on: ubuntu-latest
    # No timeout-minutes: a trial ends when the deployment says its turns ended, never on a clock
    # (AGENTS.md). GitHub's own limit is 6 hours per job, which EVAL_TRIALS_PER_JOB stays under;
    # validate.ts prints each task's slowest trial, the number to re-size it from.
    environment: eval
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A failed trial is data, so the step goes on to upload; a report missing trials is refused
      # by validate.ts in the assemble job.
      - name: Run ${{ matrix.task }}
        continue-on-error: true
        env:
          KINU_EVAL_WEB_IDENTITY: ${{ secrets.KINU_EVAL_WEB_IDENTITY }}
          KINU_EVAL_TRIALS: ${{ matrix.count }}
          KINU_EVAL_FIRST_TRIAL: ${{ matrix.first }}
          KINU_EVAL_CONCURRENCY: ${{ env.EVAL_CONCURRENCY }}
          KINU_EVAL_COMMIT: ${{ needs.plan.outputs.sha }}
          EVAL_FILE: ${{ matrix.file }}
        run: bun run evals "$EVAL_FILE"

      - name: Upload the ${{ matrix.task }} report
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-task-${{ matrix.task }}-${{ matrix.first }}
          path: bench-artifacts/evals/results.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble
    needs: [plan, evals]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      complete: ${{ steps.complete.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the task reports
        uses: actions/download-artifact@v4
        with:
          pattern: kinu-evals-task-*
          path: artifacts/tasks

      # Exactly the planned jobs, each once: a missing task would otherwise read as removed.
      - name: Join the task reports
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
        run: |
          mapfile -t reports < <(find artifacts/tasks -name results.json | sort)
          if [[ ${#reports[@]} -ne $(jq length <<<"$JOBS") ]]; then
            echo "::error::expected $(jq length <<<"$JOBS") job reports, found ${#reports[@]}"
            exit 1
          fi
          jq -s '{testResults: map(.testResults[])}' "${reports[@]}" > artifacts/results.json
          expected=$(jq -c '[.[].file] | sort' <<<"$JOBS")
          actual=$(jq -c '[.testResults[].name | sub("^.*/evals/tasks/"; "evals/tasks/")] | sort' artifacts/results.json)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::expected task files $expected, got $actual"
            exit 1
          fi

      # Only a complete, infrastructure-clean report becomes a baseline. An incomplete one is still
      # compared and posted, with its infrastructure failures named.
      - name: Check the report is a complete baseline
        id: complete
        continue-on-error: true
        run: bun evals/scripts/validate.ts artifacts/results.json --trials "$EVAL_TRIALS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Store the baseline for build ${{ needs.plan.outputs.sha }}
        if: steps.complete.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-${{ needs.plan.outputs.sha }}-${{ env.EVAL_TRIALS }}-per-task
          path: artifacts/results.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-results
          path: artifacts/results.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results
          path: artifacts/candidate

      - name: Download the baseline
        if: needs.plan.outputs.baseline-artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.plan.outputs.baseline-artifact }}
        run: |
          mkdir -p artifacts/baseline
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/baseline.zip"
          unzip -q "$RUNNER_TEMP/baseline.zip" -d artifacts/baseline

      - name: Compare with the baseline
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--candidate artifacts/candidate/results.json --out artifacts/comparison)
          if [[ -f artifacts/baseline/results.json ]]; then args+=(--baseline artifacts/baseline/results.json); fi
          bun evals/scripts/compare.ts "${args[@]}"
          bun evals/scripts/trajectories.ts artifacts/candidate/results.json artifacts/comparison/trajectories.md
          cat artifacts/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- kinu-evals-results -->'
            cat artifacts/comparison/comparison.md
            echo
            echo "[Run]($RUN_URL) · [comparison and every trial's trajectory](${RUN_URL}#artifacts)"
          } > artifacts/comparison/comment.md

      - name: Upload the comparison
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison
          if-no-files-found: error
          retention-days: 30

  diagnose:
    name: Why the evals failed
    needs: [plan, compare]
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    # Advisory: a diagnosis that fails or comes back out of shape posts nothing and fails nothing.
    continue-on-error: true
    environment: eval
    permissions:
      contents: read
    outputs:
      written: ${{ steps.why.outputs.written }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results
          path: artifacts/candidate

      - name: Download the comparison
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison

      - name: Ask a Kinu workspace why
        id: why
        env:
          KINU_EVAL_WEB_IDENTITY: ${{ secrets.KINU_EVAL_WEB_IDENTITY }}
        run: |
          bun evals/scripts/diagnose.ts --results artifacts/candidate/results.json \
            --comparison artifacts/comparison/comparison.json --out artifacts/why/why.md
          if [[ -f artifacts/why/why.md ]]; then
            { echo '<!-- kinu-evals-why -->'; cat artifacts/why/why.md; } > artifacts/why/comment.md
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the diagnosis
        if: steps.why.outputs.written == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-why
          path: artifacts/why
          retention-days: 30

  # The only jobs that write, and they run no dependency and no build: a sparse checkout of the one
  # script that posts, and gh.
  post-results:
    name: Post the results
    needs: [plan, compare]
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: evals/scripts/post-comment.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the comparison
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison

      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        # A new results comment supersedes the last diagnosis too: it explained runs this one replaces.
        run: bash evals/scripts/post-comment.sh "$SHA" artifacts/comparison/comment.md '<!-- kinu-evals-results -->' '<!-- kinu-evals-why -->'

  post-diagnosis:
    name: Post the diagnosis
    needs: [plan, diagnose, post-results]
    if: ${{ !cancelled() && needs.diagnose.outputs.written == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: evals/scripts/post-comment.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the diagnosis
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-why
          path: artifacts/why

      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: bash evals/scripts/post-comment.sh "$SHA" artifacts/why/comment.md '<!-- kinu-evals-why -->'
