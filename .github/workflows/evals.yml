name: Evals

# Whether a candidate build may be promoted. Every task in evals/tasks, five trials each, runs as the
# eval-service identity against two deployments at once, both legs with the candidate's own task
# definitions: the candidate (staging.kinu.run, serving the build to promote) and the baseline
# (kinu.run, serving the promoted build). The same definitions, the same hour and the same provider
# conditions on both sides, so no report is stored between runs and an edit to the evals moves no
# baseline. The last job, Verdict, is what a promote reads (scripts/promote.ts): it succeeds only
# when both legs are complete reports and no cohort regressed (evalGateVerdict). scripts/deploy.sh
# dispatches this with the build staging serves; anyone with write access can dispatch it by hand.
#
# The results comment goes on the pull request that merged the candidate's commit, else on the
# commit itself, and a Kinu workspace then posts why the evals failed. Earlier comments of either
# kind on the same pull request or commit are deleted first.
#
# The repository is public. Trials run on eval-service workspaces with seeded data only, and every
# string a trial produced is scrubbed (evals/src/redact.ts) before it is stored or posted.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'The build staging serves, as staging.kinu.run/api/health names it: the candidate.'
        required: true

permissions: {}

# A newer candidate's run cancels an older one's: staging serves one build at a time.
concurrency:
  group: evals
  cancel-in-progress: true

env:
  EVAL_TRIALS: '5'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.builds.outputs.sha }}
      candidate: ${{ steps.builds.outputs.candidate }}
      baseline: ${{ steps.builds.outputs.baseline }}
    steps:
      # Each leg's build as its deployment names it, and the candidate's full commit, whose definitions
      # both legs run. A deploy publishes the local checkout; a commit is only here once someone pushes it.
      - name: Read both deployments' builds
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ inputs.build }}
        run: |
          serving() {
            local sha
            sha=$(curl -fsS "$1/api/health" | jq -r '.build.sha // empty')
            if [[ ! "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::$1/api/health names no build sha" >&2
              return 1
            fi
            echo "$sha"
          }
          candidate=$(serving https://staging.kinu.run)
          baseline=$(serving https://kinu.run)
          if [[ "$candidate" != "$BUILD"* && "$BUILD" != "$candidate"* ]]; then
            echo "::error::staging.kinu.run serves $candidate, not the build $BUILD this run was dispatched to measure"
            exit 1
          fi
          for leg in candidate baseline; do
            if ! full=$(gh api "repos/$GH_REPO/commits/${!leg}" --jq .sha); then
              echo "::error::the $leg build ${!leg} is not on GitHub: push it, then dispatch again"
              exit 1
            fi
            if [[ $leg == candidate ]]; then echo "sha=$full" >> "$GITHUB_OUTPUT"; fi
          done
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Candidate: staging.kinu.run serves $candidate. Baseline: kinu.run serves $baseline." | tee -a "$GITHUB_STEP_SUMMARY"

  # Both legs at once, each in one process holding every task and every trial at once
  # (evals/vitest.config.ts): a trial waits on its deployment and its model, so a leg takes as long as
  # its slowest trial. Each leg holds only its own deployment's eval identity.
  evals:
    name: Evals (${{ matrix.leg }})
    needs: plan
    runs-on: ubuntu-latest
    # No timeout-minutes: a trial ends when the deployment says its turns ended, never on a clock
    # (AGENTS.md).
    environment: eval
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: candidate
            origin: https://staging.kinu.run
            worker: kinu-staging
          - leg: baseline
            origin: https://kinu.run
            worker: kinu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          source scripts/repo-runtime.sh
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Production changes rarely, so its leg is measured once per build and eval definitions, then
      # reused: the key names the build, the evals tree that measured it and the trial count.
      - name: Find a stored baseline
        id: stored
        if: matrix.leg == 'baseline'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
        run: |
          name="kinu-evals-baseline-${BASELINE}-$(git rev-parse HEAD:evals)-${EVAL_TRIALS}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          id=$(gh api "repos/$GH_REPO/actions/artifacts?name=$name&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // ""')
          if [[ -n "$id" ]]; then
            mkdir -p bench-artifacts/evals
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > /tmp/baseline.zip
            unzip -q /tmp/baseline.zip -d bench-artifacts/evals
            echo "Baseline: reusing $name" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # A failed trial is data, so the step goes on to upload; compare.ts names a leg that is not a
      # complete report, and the verdict fails on it.
      - name: Run every task against ${{ matrix.origin }}
        if: matrix.leg == 'candidate' || steps.stored.outputs.id == ''
        continue-on-error: true
        env:
          KINU_EVAL_ORIGIN: ${{ matrix.origin }}
          KINU_EVAL_WEB_IDENTITY: ${{ matrix.leg == 'baseline' && secrets.KINU_EVAL_WEB_IDENTITY || '' }}
          KINU_EVAL_STAGING_WEB_IDENTITY: ${{ matrix.leg == 'candidate' && secrets.KINU_EVAL_STAGING_WEB_IDENTITY || '' }}
          KINU_EVAL_TRIALS: ${{ env.EVAL_TRIALS }}
          KINU_EVAL_COMMIT: ${{ needs.plan.outputs.sha }}
          # Both legs call Muse on one opencode-go key, and 20 calls at once is all it was measured to hold
          # (evals/src/config.ts, 2026-09-26); all 340 at once were refused 429 (run 37726316713). One trial of
          # each of the seven tasks at a time: seven trials per leg, fourteen when production's leg is not reused.
          KINU_EVAL_FILES: 7
          KINU_EVAL_CONCURRENCY: 1
        run: bun run evals

      # What Workers Logs said of the leg's workspaces: exceptions, invocations ended for their limits, idle wakes. Read
      # once the trials end, and stored with a reused baseline; without the token the leg is written as not read.
      - name: Read the platform's logs of the leg's workspaces
        if: matrix.leg == 'candidate' || steps.stored.outputs.id == ''
        continue-on-error: true
        env:
          KINU_OBS_TOKEN: ${{ secrets.KINU_OBS_TOKEN }}
        run: bun evals/scripts/platform-bugs.ts bench-artifacts/evals/results.json --worker ${{ matrix.worker }} --out bench-artifacts/evals/platform.json

      - name: Summarize the report
        id: complete
        continue-on-error: true
        shell: bash
        run: bun evals/scripts/validate.ts bench-artifacts/evals/results.json --trials "$EVAL_TRIALS" | tee -a "$GITHUB_STEP_SUMMARY"

      # Only a complete baseline is stored; an incomplete one is still compared here, and measured again next run.
      - name: Store the baseline for later runs
        if: matrix.leg == 'baseline' && steps.stored.outputs.id == '' && steps.complete.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stored.outputs.name }}
          path: |
            bench-artifacts/evals/results.json
            bench-artifacts/evals/platform.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-results-${{ matrix.leg }}
          path: |
            bench-artifacts/evals/results.json
            bench-artifacts/evals/platform.json
          if-no-files-found: error
          retention-days: 30

      # Each trial's evidence, a failed one's above all: its transcript and ledger, the files and
      # slates its workspace held, and the data they served, scrubbed like the report (redact.ts).
      - name: Scrub every trial's evidence
        if: ${{ !cancelled() && (matrix.leg == 'candidate' || steps.stored.outputs.id == '') }}
        run: bun evals/scripts/scrub-evidence.ts bench-artifacts

      - name: Upload every trial's evidence
        if: ${{ !cancelled() && (matrix.leg == 'candidate' || steps.stored.outputs.id == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-evidence-${{ matrix.leg }}
          path: bench-artifacts/evals-*/
          if-no-files-found: error
          retention-days: 30

  # Runs whatever the legs' jobs ended: a leg with no report, or an incomplete one, is named in the
  # verdict rather than skipping it.
  compare:
    name: Compare
    needs: [plan, evals]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          source scripts/repo-runtime.sh
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download the candidate's report
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results-candidate
          path: artifacts/candidate

      - name: Download the baseline's report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results-baseline
          path: artifacts/baseline

      - name: Compare the legs
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
        run: |
          args=(--candidate artifacts/candidate/results.json --candidate-build "$CANDIDATE" --baseline-build "$BASELINE"
            --out artifacts/comparison --trials "$EVAL_TRIALS")
          if [[ -f artifacts/baseline/results.json ]]; then args+=(--baseline artifacts/baseline/results.json); fi
          if [[ -f artifacts/candidate/platform.json ]]; then args+=(--candidate-platform artifacts/candidate/platform.json); fi
          if [[ -f artifacts/baseline/platform.json ]]; then args+=(--baseline-platform artifacts/baseline/platform.json); fi
          bun evals/scripts/compare.ts "${args[@]}"
          bun evals/scripts/trajectories.ts artifacts/candidate/results.json artifacts/comparison/trajectories.md
          cat artifacts/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- kinu-evals-results -->'
            cat artifacts/comparison/comparison.md
            echo
            echo "[Run]($RUN_URL) · [comparison and every trial's trajectory](${RUN_URL}#artifacts)"
          } > artifacts/comparison/comment.md

      - name: Upload the comparison
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison
          if-no-files-found: error
          retention-days: 30

  # What a promote reads: it finds this job by its name, `Verdict`, and requires it completed with
  # success. It succeeds only when both legs are complete reports, they were compared, and no cohort
  # regressed (evalGateVerdict, written by compare.ts); anything else fails it, saying why.
  verdict:
    name: Verdict
    needs: [plan, evals, compare]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the comparison
        if: needs.compare.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison

      - name: Stand or fall on the comparison
        env:
          PLAN: ${{ needs.plan.result }}
          EVALS: ${{ needs.evals.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          if [[ "$PLAN" != success ]]; then
            echo "::error::No verdict: the plan ended $PLAN, so no leg ran (its log names the build staging serves, or the commit not on GitHub)"
            exit 1
          fi
          if [[ "$COMPARE" != success ]]; then
            echo "::error::No verdict: the legs' jobs ended $EVALS and the comparison $COMPARE, so the legs were not compared"
            exit 1
          fi
          reason=$(jq -r .reason artifacts/comparison/verdict.json)
          echo "$reason" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r .pass artifacts/comparison/verdict.json)" != true ]]; then
            echo "::error::$reason"
            exit 1
          fi

  diagnose:
    name: Why the evals failed
    needs: [plan, compare]
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    # Advisory: the Verdict does not wait on it, so a review that fails or comes back out of shape posts nothing and
    # blocks nothing; it fails here, where it shows.
    environment: eval
    permissions:
      contents: read
    outputs:
      written: ${{ steps.why.outputs.written || steps.review.outputs.written }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          source scripts/repo-runtime.sh
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download the candidate's report
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results-candidate
          path: artifacts/candidate

      - name: Download the candidate's evidence
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-evidence-candidate
          path: artifacts/candidate/evidence

      # The baseline's trials, passing ones included, are what the review compares the candidate's work against.
      - name: Download the baseline's report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-results-baseline
          path: artifacts/baseline

      - name: Download the comparison
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison

      # The review runs on staging as eval-service, which holds the reviewer's ChatGPT login across resets
      # (scripts/credential-checkpoint.ts); production holds none.
      - name: Ask a Kinu workspace why, and how the work changed
        id: why
        env:
          KINU_EVAL_ORIGIN: https://staging.kinu.run
          KINU_EVAL_STAGING_WEB_IDENTITY: ${{ secrets.KINU_EVAL_STAGING_WEB_IDENTITY }}
        run: |
          args=(--results artifacts/candidate/results.json --comparison artifacts/comparison/comparison.json
            --evidence artifacts/candidate/evidence --out artifacts/why/why.md)
          if [[ -f artifacts/baseline/results.json ]]; then args+=(--baseline artifacts/baseline/results.json); fi
          bun evals/scripts/diagnose.ts "${args[@]}"
          if [[ -f artifacts/why/why.md ]]; then
            { echo '<!-- kinu-evals-why -->'; cat artifacts/why/why.md; } > artifacts/why/comment.md
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi

      # One review per trial, passing ones too, by the reviewer agent over a trimmed rollout, put together with the run's
      # measures; reported beside the verdict, never deciding it. A diagnosis that failed does not stop it.
      - name: Review every trial of the candidate
        id: review
        if: ${{ !cancelled() }}
        env:
          KINU_EVAL_ORIGIN: https://staging.kinu.run
          KINU_EVAL_STAGING_WEB_IDENTITY: ${{ secrets.KINU_EVAL_STAGING_WEB_IDENTITY }}
        run: |
          bun evals/scripts/review.ts --results artifacts/candidate/results.json --comparison artifacts/comparison/comparison.json --out artifacts/why
          {
            echo '<!-- kinu-evals-why -->'
            if [[ -f artifacts/why/why.md ]]; then cat artifacts/why/why.md; echo; fi
            cat artifacts/why/review.md
          } > artifacts/why/comment.md
          echo "written=true" >> "$GITHUB_OUTPUT"

      - name: Upload the diagnosis
        if: ${{ !cancelled() && (steps.why.outputs.written == 'true' || steps.review.outputs.written == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: kinu-evals-why
          path: artifacts/why
          retention-days: 30

  # The only jobs that write, and they run no dependency and no build: a sparse checkout of the one
  # script that posts, and gh.
  post-results:
    name: Post the results
    needs: [plan, compare]
    if: ${{ !cancelled() && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: evals/scripts/post-comment.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the comparison
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-comparison
          path: artifacts/comparison

      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        # A new results comment supersedes the last diagnosis too: it explained runs this one replaces.
        run: bash evals/scripts/post-comment.sh "$SHA" artifacts/comparison/comment.md '<!-- kinu-evals-results -->' '<!-- kinu-evals-why -->'

  post-diagnosis:
    name: Post the diagnosis
    needs: [plan, diagnose, post-results]
    if: ${{ !cancelled() && needs.diagnose.outputs.written == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: evals/scripts/post-comment.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the diagnosis
        uses: actions/download-artifact@v4
        with:
          name: kinu-evals-why
          path: artifacts/why

      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: bash evals/scripts/post-comment.sh "$SHA" artifacts/why/comment.md '<!-- kinu-evals-why -->'
