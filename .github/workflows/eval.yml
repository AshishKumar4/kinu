name: Quality Eval

# Two jobs with different costs, so they get different triggers.
#
# `benchmark` makes REAL model calls. It runs only when someone asks for it —
# manual dispatch, or a PR labelled `run-eval`. It used to run nightly with the
# baseline defaulting to the candidate model, i.e. it paid every night to have
# one model judged against itself, against an uncalibrated floor, on a corpus
# containing tasks a no-tools single-shot cannot perform. The script now refuses
# that configuration; the schedule is gone with it.
#
# WHO IT RUNS AS, AND WHERE IT POINTS. The `eval-service` account, against the
# staging deployment. Both come from scripts/eval-credentials.ts over
# packages/test-utils/src/eval-identity.ts — the resolution every other eval
# path uses — and a credential aimed at any other deployment is refused there
# and stops this job. It used to read a base URL and an auth header straight
# from repository secrets, so one secret could name production and nothing
# asked. Two vendor keys remain secrets, ANTHROPIC_API_KEY and OPENAI_API_KEY:
# each buys a model from its vendor, names no deployment, and creates nothing.
#
# `validate-corpus` needs no credentials and no model, so it keeps the nightly
# cadence. It is the measurement instrument's own integrity check: every bench
# task's defect must break this repo's checks and reversing it must restore
# them.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Candidate model spec (provider/model). Blank = vars.EVAL_MODEL.'
        required: false
      baseline_model:
        description: 'Baseline model spec. Must differ from the candidate. Blank = vars.EVAL_BASELINE_MODEL.'
        required: false
      min_score:
        description: 'Quality floor [0..1]. Blank = committed DEFAULT_QUALITY_THRESHOLD.'
        required: false
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [labeled]

jobs:
  benchmark:
    # Never on the schedule — this one costs money. Dispatch, or an explicit
    # `run-eval` label on a PR.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.label.name == 'run-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fast, credential-free guard: report shape + threshold gate logic.
      - name: Verify gate logic (no model calls)
        run: bun test scripts/eval.test.ts packages/core/tests/unit-eval-report.test.ts

      # The identity and the target, resolved by the one process that resolves
      # them. Two lines on stdout — origin, then token — or nothing when no eval
      # credential exists. A NON-ZERO EXIT IS FATAL: it means the credential
      # named a deployment the allowlist refuses, and `bash -e` stops the job
      # before anything spends. The token reaches the next step through
      # $GITHUB_ENV rather than a command line, so it appears in no process
      # listing.
      - name: Resolve the eval-service identity
        shell: bash
        env:
          KINU_EVAL_TOKEN: ${{ secrets.EVAL_SERVICE_TOKEN }}
        run: |
          RESOLVED="$(bun scripts/eval-credentials.ts)"
          mapfile -t PAIR <<< "$RESOLVED"
          if [[ ${#PAIR[@]} -eq 2 ]]; then
            printf 'KINU_ORIGIN=%s\n' "${PAIR[0]}" >> "$GITHUB_ENV"
            printf 'KINU_TOKEN=%s\n' "${PAIR[1]}" >> "$GITHUB_ENV"
          fi

      # The live A/B, over that pair. With no credential anywhere the script
      # fails with an honest message instead of measuring nothing — this job runs
      # only when somebody dispatched it or labelled a PR, so a green run that
      # called no model would answer a question nobody asked. It also refuses to
      # run when the baseline is not a different model.
      - name: Run model A/B
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
          KINU_MODEL: ${{ github.event.inputs.model || vars.EVAL_MODEL }}
          EVAL_MIN_SCORE: ${{ github.event.inputs.min_score || vars.EVAL_MIN_SCORE }}
        run: >-
          bun scripts/eval.ts --out eval-report.json
          --baseline-model "${{ github.event.inputs.baseline_model || vars.EVAL_BASELINE_MODEL }}"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  validate-corpus:
    # Free: no model, no credentials. Runs the repo suite ~160 times, which is
    # why it is nightly rather than per-push — the per-push half (every defect
    # patch still applies) lives in the CI workflow's bench harness step.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate bench corpus
        run: bun scripts/bench.ts validate --run-root "$RUNNER_TEMP/bench"
