name: Lean 4 Verification

# Read the checkout, and nothing else: this workflow runs pull request code.
permissions:
  contents: read

on:
  push:
    paths:
      - 'lean/**'
      - 'packages/**/src/**/*.ts'
      - 'scripts/verify-lean.sh'
      - '.github/actions/setup-lean/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lean-verify.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'packages/**/src/**/*.ts'
      - 'scripts/verify-lean.sh'
      - '.github/actions/setup-lean/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/lean-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned, checksum-verified, and caching the BUILD as well as the
      # toolchain — this job used to rebuild every theorem on every run.
      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      - name: Verify Lean proofs, consistency, and traceability
        shell: bash
        run: bash scripts/verify-lean.sh
