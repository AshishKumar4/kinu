name: Lean 4 Verification

# Read the checkout, and nothing else: this workflow runs pull request code.
permissions:
  contents: read

# NO `paths:` FILTER, and its absence is the gate.
#
# `scripts/verify-lean.sh` runs four things, and only two of them read `lean/`:
#
#   lake build              lean/**
#   check-no-false.sh       lean/**
#   check-traceability.mjs  lean/traceability.yaml, lean/**, AND every `.ts` file
#                           a tsRef names — measured 143 cited declarations,
#                           including packages/core/tests/ and
#                           scripts/fixtures/storage-matrix/
#   lean-citations.ts       EVERY tracked text source. Measured: 1,987 files, 95
#                           module / 47 theorem / 1 line citations.
#
# Any filter narrow enough to write down is a strict SUBSET of what the gates
# read, and the gap is not hypothetical: Lean citations live in `docs/` (3
# files), `scripts/` (5), `packages/core/tests/` (6) and `tests/bench/patches/`
# (1), and the traceability manifest cites `packages/core/tests/` and
# `scripts/fixtures/storage-matrix/` directly. Under a filter of `lean/**`,
# `packages/**/src/**/*.ts`, `scripts/verify-lean.sh`,
# `.github/actions/setup-lean/**` and the two workflow files, neither
# `scripts/lean-citations.ts` nor `lean/check-traceability.mjs` — two of the four
# gates, including the one that reads the widest corpus — is a trigger path at
# all, so editing a gate does not run it. On a pull request, `ci.yml`'s
# `verify-lean` job is skipped (`push` to `main` only), so this workflow is the
# ONLY thing standing behind those files, and a broken citation added to
# `docs/FORMAL-SPEC.md` would reach `main` with no Lean gate having run.
#
# Enumerating the real union is the same thing as not filtering — the citation
# corpus is every tracked text file — so there is no filter at all, rather than
# a list nobody could keep true. It is affordable because
# `.github/actions/setup-lean` caches `lean/.lake` keyed on
# `hashFiles('lean/lean-toolchain', 'lean/**/*.lean')`: a change outside `lean/`
# is an exact cache hit and `lake build` replays in seconds instead of rebuilding
# 330 theorems. `scripts/lean-citations.test.ts` asserts this file declares no
# path filter narrower than the corpus, so re-adding one is a test failure that
# names the files it would drop.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned, checksum-verified, and caching the BUILD as well as the
      # toolchain, so a run that touches nothing under `lean/` replays instead
      # of rebuilding every theorem.
      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # scripts/verify-lean.sh ends in `bun ../scripts/lean-citations.ts`, which
      # reads the corpus through scripts/sources.ts and its dependencies; the
      # step needs Bun and an install, or it fails on an import.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Lean proofs, consistency, and traceability
        shell: bash
        run: bash scripts/verify-lean.sh
