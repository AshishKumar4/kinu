name: Lean 4 Verification

on:
  push:
    paths:
      - 'lean/**'
      - 'packages/core/src/types/**'
      - 'packages/core/src/execution/types.ts'
      - 'packages/core/src/evolution/types.ts'
      - 'packages/core/src/config.ts'
      - 'scripts/verify-lean.sh'
      - '.github/workflows/lean-verify.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'packages/core/src/types/**'
      - 'packages/core/src/execution/types.ts'
      - 'packages/core/src/evolution/types.ts'
      - 'packages/core/src/config.ts'
      - 'scripts/verify-lean.sh'
      - '.github/workflows/lean-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: lean-${{ hashFiles('lean/lean-toolchain') }}

      - name: Verify Lean proofs and TS drift
        shell: bash
        run: bash scripts/verify-lean.sh
