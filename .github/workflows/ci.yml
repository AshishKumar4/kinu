name: CI

# No suites or gates are listed here. Hosted row/file timings balance eight
# source runners; each of the six contended runs owns its hammer runner.
# Collection requires every execution unit and split-suite file (L23).
permissions:
  contents: read

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - id: plan
        run: echo "matrix=$(bun scripts/ladder.ts --ci-matrix)" >> "$GITHUB_OUTPUT"

  gate-ladder:
    name: Ladder (${{ matrix.part }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # The row's silence bound is unchanged. This job cap still covers setup and
    # a hang outside a row; it is not the expected sharded wall.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit-message/history gates need the range back to their boundary.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Browser rows use the runner's Chrome. bubblewrap and ffmpeg/ffprobe are
      # absent from its image; the upload part runs neither and needs no apt.
      - name: Resolve system prerequisites
        if: matrix.part != 'upload'
        id: apt
        run: |
          sudo apt-get update
          echo "key=$(sudo apt-get install --yes --no-install-recommends --print-uris bubblewrap ffmpeg | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.part != 'upload'
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ steps.apt.outputs.key }}
          restore-keys: |
            apt-${{ runner.os }}-
      - name: Install system prerequisites
        if: matrix.part != 'upload'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install --yes --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" bubblewrap ffmpeg
          # Ubuntu 24.04 otherwise refuses the sandbox suite's namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Gate ladder — CI part
        run: bun scripts/ladder.ts --tier=ci --ci-part=${{ matrix.part }} --verdicts=bench-artifacts/ci/verdicts.json
      - name: Publish row verdicts, red or green
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-verdicts-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: bench-artifacts/ci/verdicts.json
          if-no-files-found: error
      - name: Publish hammer evidence
        if: always() && startsWith(matrix.part, 'hammer-')
        uses: actions/upload-artifact@v4
        with:
          name: hammer-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: bench-artifacts/hammer/
          if-no-files-found: error
      # The bundle is still proved once, not once per shard.
      - name: Production bundle
        if: matrix.part == 'source-1'
        working-directory: packages/cf-backend
        run: ../../node_modules/.bin/vite build

  verdicts:
    needs: [plan, gate-ladder]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: ladder-verdicts-${{ github.sha }}-${{ github.run_attempt }}-*
          path: bench-artifacts/ci/parts
      - name: Require the complete tier's row coverage
        run: bun scripts/ladder.ts --ci-collect=bench-artifacts/ci/parts --verdicts=bench-artifacts/ci/verdicts.json
      - name: Publish the exact revision's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-verdicts-${{ github.sha }}-${{ github.run_attempt }}-all
          path: bench-artifacts/ci/verdicts.json
          if-no-files-found: error

  verify-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lean remains the written CI-tier exemption, and a deploy-only row on an
    # integration push; main and path-filtered PR workflows also verify it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Lean
        uses: ./.github/actions/setup-lean
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Verify Lean proofs, consistency, and traceability
        run: bash scripts/verify-lean.sh
