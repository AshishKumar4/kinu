name: CI

# This workflow deliberately enumerates NO suites and NO gates.
#
# It used to. Measured 2026-08-17 at 5183d69d, its hand-written step list ran 339
# of the repository's 400 tracked test files while `scripts/deploy.sh` ran 395 —
# it skipped packages/compaction (95 tests), agent-utils (12), pc-agent (6), 41
# of 42 `cli` files, the whole root `tests/` directory, and `bun run layergate`
# entirely. None of that was visible from a green badge, and one of the
# exclusions ("the full packages/cli suite stays out of CI for now because its
# PTY tests need a terminal") was simply stale: the suite runs headless at 295
# pass / 0 fail in 96s.
#
# Three lists that can disagree is the defect. So there is one:
# `scripts/ladder.ts`, whose deploy tier is parsed out of deploy.sh and whose
# CI-vs-deploy delta is a written exemption asserted by scripts/ladder.test.ts.
# A gate added to deploy.sh now appears here on the next run, or the ladder test
# fails naming it. Adding a `run: bun test …` step below is itself a test
# failure — that assertion is what keeps this file from growing a second list.

# Read the checkout, and nothing else. This workflow runs pull request code, so
# the default token permissions are the ones that matter most here.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-ladder:
    runs-on: ubuntu-latest
    # The declared CI tier is 257s of gates; the cap is generous enough for a
    # cold runner and tight enough that a hung gate fails rather than idles.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prints the where-it-runs matrix into the log before anything runs, so the
      # answer to "what did this badge actually check?" is in the artefact rather
      # than in someone's memory of the workflow file.
      - name: Gate ladder matrix
        run: bun scripts/ladder.ts --matrix

      - name: Gate ladder — CI tier
        run: bun scripts/ladder.ts --tier=ci

      # Not in the ladder: this proves the Worker bundles, which is a build
      # rather than a gate, and it has no test files to claim.
      - name: Production bundle
        working-directory: packages/cf-backend
        run: ../../node_modules/.bin/vite build

  verify-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one written CI-tier exemption (scripts/ladder.ts CI_EXEMPT): the elan
    # toolchain and a 15-minute Lean build. Main-push gate; pull requests use the
    # path-filtered lean-verify workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # scripts/verify-lean.sh ends in `bun ../scripts/lean-citations.ts`, which
      # reads the corpus through scripts/sources.ts and its dependencies; the
      # step needs Bun and an install, or it fails on an import.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Lean proofs, consistency, and traceability
        run: bash scripts/verify-lean.sh
