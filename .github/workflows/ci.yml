name: CI

on:
  push:
    branches: [main, worktree-proteus-v2-runtime]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run check

      - name: Core unit tests
        run: bun test --cwd packages/core

      # The backend suites, including the conformance gates: each backend's
      # REAL composition root observed against the capability manifest
      # (core/src/conformance). A gate that does not run in CI converts at the
      # same rate as advice — these suites previously never ran here, which is
      # how "X never worked on Y backend" stayed green.
      - name: Backend suites (cf + cli-backend)
        run: bun test --cwd packages/cf-backend && bun test --cwd packages/cli-backend

      # The CLI conformance observer drives the production create→open→session
      # chain; the full packages/cli suite stays out of CI for now because its
      # PTY tests need a terminal.
      - name: CLI conformance gate
        run: bun test packages/cli/tests/conformance.test.ts

      # Credential-free eval-gate verification. The live-model benchmark runs in
      # the separate, gated eval.yml (manual / nightly / `run-eval` label).
      - name: Eval gate logic
        run: bun test scripts/eval.test.ts

      # Bench harness guarantees: sandbox isolation, the seal, anti-self-scoring,
      # budget enforcement, corpus well-formedness. No model, no credentials.
      - name: Bench harness guarantees
        run: bun test scripts/bench.test.ts

  verify-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Main-push gate; pull requests use the path-filtered lean-verify workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: lean-${{ hashFiles('lean/lean-toolchain') }}

      - name: Verify Lean proofs, consistency, and traceability
        run: bash scripts/verify-lean.sh
