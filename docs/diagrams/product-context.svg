<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1234" viewBox="0 0 640 1234" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="context-title context-desc">
<title id="context-title">CURRENT + TARGET: Context, history and editable views</title>
<desc id="context-desc">Current actor history and compaction state are held in actor SQLite. Memory, scaffold source and compaction recall ranges live in the workspace file plane. Both feed the model-facing working context. Conversational actors have editable scaffold hooks, but a facet scaffold path does not prove that every exploration actor executes a promoted editable loop. The target adds readable and editable VFS views of working context, history and loop revisions under a proposed revision-checked protocol. Raw audit and policy stay protected.</desc>
