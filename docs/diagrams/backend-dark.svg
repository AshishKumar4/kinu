  <text class="band" x="38" y="186">PACKAGES/CORE — PLATFORM-CLEAN</text>
  <text class="xs" x="862" y="186" text-anchor="end">two dependencies · no import of agents, @cloudflare/* or cloudflare:workers</text>
  <rect x="38" y="196" width="824" height="46" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="b mono" x="50" y="217" text-anchor="start">AgentOrchestrator  ·  the turn pipeline</text>
  <text class="s" x="50" y="232" text-anchor="start">turn-context → prepare-step → stream → signals → completeTurn</text>
