  <text class="b" x="50" y="275" text-anchor="start">Tools</text>
  <text class="xs" x="50" y="290" text-anchor="start">8 builtins, dep-gated</text>
  <text class="xs" x="50" y="305" text-anchor="start">crafted · MCP · extensions</text>
  <rect x="247" y="254" width="197" height="58" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="b" x="259" y="275" text-anchor="start">Delegation</text>
  <text class="xs" x="259" y="290" text-anchor="start">the agents tool</text>
  <text class="xs" x="259" y="305" text-anchor="start">the swarm engine</text>
