  <text class="xs" x="24" y="519">dashed = optional — its absence degrades one capability rather than breaking the loop</text>
  <text class="xs" x="24" y="535">Declared, the boundary is this small. In practice it is wider, because cf-backend imports 650 distinct core names and cli-backend 361 (src only, 2026-08-19).</text>
  <line x1="24" y1="545" x2="876" y2="545" stroke="var(--orangeLine)" stroke-width="2"/>
