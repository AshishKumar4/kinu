  <text class="s" x="474" y="605" text-anchor="start">LocalAgentSession implements BackendHost, driving the same orchestrator</text>
  <text class="xs" x="474" y="629" fill="var(--fg)">storage</text>
  <text class="xs" x="592" y="629">one bun:sqlite file; Nimbus VFS for files</text>
  <text class="xs" x="474" y="646" fill="var(--fg)">shell</text>
  <text class="xs" x="592" y="646">the real host process, checkpointed</text>
  <text class="xs" x="474" y="663" fill="var(--fg)">schedule</text>
