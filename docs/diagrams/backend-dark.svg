<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" role="img" aria-labelledby="t d">
  <!-- A README figure. Its sibling in this directory (same name, -dark suffix)
       is the same geometry under a different :root palette, and the README picks
       between the two with <picture>. Everything below the palette block must
       stay byte-identical in both, so edit them together. -->
  <title id="t">Kinu: one core, two backends</title>
  <desc id="d">Clients and autonomous ingress feed a platform-clean core package that owns the turn pipeline, tools, delegation, evolution, context, the canonical workspace file plane, the execution router and the event log. Below it, two interfaces are implemented twice, AgentRuntime for resource primitives and BackendHost for loop capabilities: by the Cloudflare backend, where a workspace is a Durable Object, and by the local CLI backend running on your own machine.</desc>
  <style>
    :root {
      --fg: #e6edf3;
      --muted: #9198a1;
      --faint: #7d8590;
      --rule: #3d444d;
      --ruleStrong: #6e7681;
      --surface: #151b23;
      --surfaceAlt: #0d1117;
      --bandFill: #12181f;
      --bandStroke: #2f3742;
      --blue: #79c0ff;
      --blueFill: #0c2d6b22;
      --blueLine: #4493f8;
      --orange: #ffa657;
      --orangeFill: #76210022;
      --orangeLine: #db6d28;
      --green: #7ee787;
      --greenFill: #0f503622;
      --greenLine: #3fb950;
      --purple: #d2a8ff;
      --purpleFill: #4c288922;
      --purpleLine: #ab7df8;
      --pink: #ff9bce;
      --pinkFill: #7d234922;
      --pinkLine: #f778ba;
      --slateFill: #1c222b;
    }
    text { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: var(--fg); }
    text.mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .h  { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
    .b  { font-size: 13px; font-weight: 600; }
    .s  { font-size: 11.5px; fill: var(--muted); }
    .xs { font-size: 10.5px; fill: var(--faint); }
    .band { font-size: 11px; font-weight: 700; letter-spacing: .9px; fill: var(--faint); }
    .edge { fill: none; stroke: var(--ruleStrong); stroke-width: 1.4; }
    .edge-lite { fill: none; stroke: var(--rule); stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--ruleStrong)"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--blueLine)"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--purpleLine)"/>
    </marker>
    <marker id="a-pink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--pinkLine)"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--greenLine)"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--orangeLine)"/>
    </marker>
  </defs>
  <text class="h" x="24" y="30">One core, two backends</text>
  <text class="s" x="24" y="49">packages/core holds every decision; a backend supplies the platform underneath it</text>
  <text class="band" x="24" y="76">CLIENTS AND INGRESS</text>
  <rect x="24" y="88" width="274" height="56" rx="7" fill="var(--blueFill)" stroke="var(--blueLine)"/>
  <text class="b" x="36" y="109" text-anchor="start" fill="var(--blue)">Web UI</text>
  <text class="s" x="36" y="124" text-anchor="start">React, six work surfaces</text>
  <text class="xs" x="36" y="139" text-anchor="start">chat over WebSocket</text>
  <rect x="313" y="88" width="274" height="56" rx="7" fill="var(--blueFill)" stroke="var(--blueLine)"/>
  <text class="b" x="325" y="109" text-anchor="start" fill="var(--blue)">kinu CLI</text>
  <text class="s" x="325" y="124" text-anchor="start">chat · exec · TUI · ACP</text>
  <text class="xs" x="325" y="139" text-anchor="start">local session or cloud RPC</text>
  <rect x="602" y="88" width="274" height="56" rx="7" fill="var(--pinkFill)" stroke="var(--pinkLine)"/>
