  <text class="xs" x="468" y="305" text-anchor="start">mutable scaffold</text>
  <rect x="665" y="254" width="197" height="58" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="b" x="677" y="275" text-anchor="start">Context</text>
  <text class="xs" x="677" y="290" text-anchor="start">system prompt · dynamic</text>
  <text class="xs" x="677" y="305" text-anchor="start">block · compaction ladder</text>
  <rect x="38" y="324" width="266" height="46" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="b" x="50" y="345" text-anchor="start">Workspace files</text>
  <text class="xs" x="50" y="360" text-anchor="start">/home/user, plus one home per agent</text>
