<text x="68" y="401" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Step-level adaptation</tspan>
</text>
<text x="68" y="435" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Update crafted-tool fitness.</tspan>
<tspan x="68" dy="30">Record changed-approach recoveries.</tspan>
<tspan x="68" dy="30">Execution success is not task correctness.</tspan>
</text>
</g>
<path d="M320 534 V570" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#evolution-arrow)" />
<g>
<rect x="48" y="572" width="544" height="168" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="607" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
