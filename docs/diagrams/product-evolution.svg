<text x="68" y="813" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Window and lifetime review</tspan>
</text>
<text x="68" y="847" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Reflect across completed work.</tspan>
<tspan x="68" dy="30">Evaluate proposed scaffold revisions.</tspan>
<tspan x="68" dy="30">Consolidate and retire crafted tools.</tspan>
