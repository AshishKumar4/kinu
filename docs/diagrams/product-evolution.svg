<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1426" viewBox="0 0 640 1426" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="evolution-title evolution-desc">
<title id="evolution-title">CURRENT: Evolution follows evidence</title>
<desc id="evolution-desc">Current evolution has a step-level channel for crafted-tool fitness and execution-recovery findings, turn-level outcome review, and longer session-window and lifetime processes. A tool that returns is not proof of task correctness. Negative outcomes can produce lessons; corroboration gates curated memory. Proposed scaffold changes pass validation and evaluation rather than becoming policy automatically. Records distinguish promotion, rejection and rollback.</desc>
