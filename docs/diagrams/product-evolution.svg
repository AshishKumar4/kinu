<text x="68" y="1259" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Notes, tools and scaffold revisions</tspan>
<tspan x="68" dy="30">inform later work through their stores.</tspan>
