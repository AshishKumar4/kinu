</text>
<text x="68" y="641" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Review the turn against its outcome.</tspan>
<tspan x="68" dy="30">Store lessons and reusable patterns.</tspan>
<tspan x="68" dy="30">Corroboration controls curated memory.</tspan>
</text>
</g>
