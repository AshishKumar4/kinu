</text>
<text x="68" y="229" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Tool returns or raises</tspan>
<tspan x="68" dy="30">User feedback and execution verdicts</tspan>
<tspan x="68" dy="30">Record which kind of evidence arrived.</tspan>
</text>
</g>
