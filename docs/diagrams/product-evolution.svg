<tspan x="68" dy="0">Validate before wider changes</tspan>
</text>
<text x="68" y="1053" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Apply the existing validation gates.</tspan>
<tspan x="68" dy="30">A proposed scaffold can be rejected.</tspan>
<tspan x="68" dy="30">Record promotion or rollback.</tspan>
</text>
</g>
<path d="M320 1152 V1188" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#evolution-arrow)" />
<g>
