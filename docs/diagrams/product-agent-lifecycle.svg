<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1396" viewBox="0 0 640 1396" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="agent-lifecycle-title agent-lifecycle-desc">
<title id="agent-lifecycle-title">CURRENT: Agent creation and lifetime</title>
<desc id="agent-lifecycle-desc">Current lifecycle. Creating a workspace establishes a default main agent and canonical files. Hire creates a durable subordinate; temporary ask uses the same roster and runtime then dismisses after its report while keeping history. Swarm actors belong to a search. Identity, role and work assignment scope each actor. A workspace storage fork instead creates a new workspace with lineage, excluding credentials and device authorization.</desc>
<!-- Sources: packages/core/src/subordinates/temporary.ts:createTemporaryAgentPort; packages/core/src/identity/fork.ts; docs/WORKSPACES.md. Current-source baseline: 9e452eadaaedcc5994fbc0c43cd4bcfc83588b5a. -->
<style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}path,rect{vector-effect:non-scaling-stroke}</style>
<defs>
<marker id="agent-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9 Z" fill="#8A7B66"/>
</marker>
</defs>
<rect width="640" height="1396" rx="14" fill="#F7F3E9"/>
<text x="32" y="35" font-size="18" font-weight="700" fill="#35633A" text-anchor="start">
<tspan x="32" dy="0">CURRENT</tspan>
</text>
<text x="32" y="78" font-size="28" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="32" dy="0">Agent creation and lifetime</tspan>
</text>
<text x="32" y="111" font-size="21" font-weight="400" fill="#625544" text-anchor="start">
<tspan x="32" dy="0">Creation, identity and lifetime are separate decisions.</tspan>
</text>
<g>
<rect x="48" y="160" width="544" height="138" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="195" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Create a workspace</tspan>
</text>
<text x="68" y="229" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Seed identity and canonical files.</tspan>
<tspan x="68" dy="30">Create its default main agent.</tspan>
</text>
</g>
<path d="M320 298 V334" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#agent-lifecycle-arrow)" />
<g>
<rect x="48" y="336" width="544" height="168" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="371" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Add an actor when needed</tspan>
</text>
<text x="68" y="405" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">hire: durable subordinate</tspan>
<tspan x="68" dy="30">ask(role): temporary roster actor</tspan>
<tspan x="68" dy="30">swarm: search-owned actor</tspan>
</text>
</g>
<path d="M320 504 V540" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#agent-lifecycle-arrow)" />
<g>
<rect x="48" y="542" width="544" height="168" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="577" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Seed identity and scope</tspan>
</text>
<text x="68" y="611" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Set role, parent and work assignment.</tspan>
<tspan x="68" dy="30">Hire adds a bounded context digest.</tspan>
<tspan x="68" dy="30">Files belong to the workspace.</tspan>
</text>
</g>
<path d="M320 710 V746" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#agent-lifecycle-arrow)" />
<g>
<rect x="48" y="748" width="544" height="138" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="783" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Run or wait</tspan>
</text>
<text x="68" y="817" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Receive work through admitted events.</tspan>
<tspan x="68" dy="30">Run the assigned turn or await a wake.</tspan>
</text>
</g>
<path d="M320 886 V922" fill="none" stroke="#8A7B66" stroke-width="2" marker-end="url(#agent-lifecycle-arrow)" />
<g>
<rect x="48" y="924" width="544" height="168" rx="10" fill="#FFFCF5" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="959" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Finish according to lifetime</tspan>
</text>
<text x="68" y="993" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Temporary ask: report, then dismiss</tspan>
<tspan x="68" dy="30">with history kept.</tspan>
<tspan x="68" dy="30">Durable subordinate: stays available.</tspan>
</text>
</g>
<g>
<rect x="48" y="1130" width="544" height="168" rx="10" fill="#E5EDF0" stroke="#8A7B66" stroke-width="1.5" />
<text x="68" y="1165" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">A workspace fork is different</tspan>
</text>
<text x="68" y="1199" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Copy a snapshot to a new workspace.</tspan>
<tspan x="68" dy="30">Record lineage; do not copy credentials</tspan>
<tspan x="68" dy="30">or device authorizations.</tspan>
</text>
</g>
<path d="M32 1338 H608" stroke="#CBBFA9"/>
<text x="32" y="1368" font-size="18" font-weight="400" fill="#625544" text-anchor="start">
<tspan x="32" dy="0">Arrows show the labeled flow, not unrestricted access.</tspan>
</text>
</svg>
