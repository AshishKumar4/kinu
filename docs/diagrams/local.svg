<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-labelledby="t d">
  <!-- A README figure. Its sibling in this directory (same name, -dark suffix)
       is the same geometry under a different :root palette, and the README picks
       between the two with <picture>. Everything below the palette block must
       stay byte-identical in both, so edit them together. -->
  <title id="t">Kinu's local CLI and TUI</title>
  <desc id="d">The kinu TUI consumes the AgentClient interface. LocalAgentClient calls LocalAgentSession in the same process, without a local server. The session runs core ChatSession with the real host shell and tools in the recorded project folder. The global vfs root is the workspace's own space under ~/.kinu/&lt;workspace&gt;, holding home/&lt;agent&gt;, slates and the agent.db database for conversations, memory and jobs, with a read-only /skills view. The opened folder mounts at /local, and local:// aliases vfs://local.</desc>
  <style>
    :root {
      --fg: #1f2328;
      --muted: #59636e;
      --faint: #818b98;
      --rule: #d1d9e0;
      --ruleStrong: #8c959f;
      --surface: #f6f8fa;
      --surfaceAlt: #ffffff;
      --bandFill: #f6f8fa;
      --bandStroke: #d1d9e0;
      --blue: #0550ae;
      --blueFill: #ddf4ff;
      --blueLine: #0969da;
      --orange: #953800;
      --orangeFill: #fff1e5;
      --orangeLine: #bc4c00;
      --green: #1a7f37;
      --greenFill: #dafbe1;
      --greenLine: #1f883d;
      --purple: #6639ba;
      --purpleFill: #fbefff;
      --purpleLine: #8250df;
      --pink: #99286e;
      --pinkFill: #ffeff7;
      --pinkLine: #bf3989;
      --slateFill: #eef1f4;
    }
    text { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: var(--fg); }
    text.mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .h  { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
    .b  { font-size: 13px; font-weight: 600; }
    .s  { font-size: 11.5px; fill: var(--muted); }
    .xs { font-size: 10.5px; fill: var(--faint); }
    .band { font-size: 11px; font-weight: 700; letter-spacing: .9px; fill: var(--faint); }
    .edge { fill: none; stroke: var(--ruleStrong); stroke-width: 1.4; }
    .edge-lite { fill: none; stroke: var(--rule); stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--ruleStrong)"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--blueLine)"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--purpleLine)"/>
    </marker>
    <marker id="a-pink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--pinkLine)"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--greenLine)"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--orangeLine)"/>
    </marker>
  </defs>
  <text class="h" x="24" y="30">A local workspace, in the folder you open</text>
  <text class="s" x="24" y="49">the TUI is a client; the local session runs the agent in the same process</text>
  <text class="band" x="24" y="76">YOUR MACHINE</text>
  <rect x="24" y="88" width="258" height="88" rx="7" fill="var(--blueFill)" stroke="var(--blueLine)"/>
  <text class="b" x="36" y="110" fill="var(--blue)">kinu · CLI / TUI</text>
  <text class="s" x="36" y="129">LocalAgentClient</text>
  <text class="xs" x="36" y="149">the AgentClient interface</text>
  <text class="xs" x="36" y="165">shared by local and cloud clients</text>
  <path d="M282 132 L314 132" fill="none" stroke="var(--blueLine)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a-blue)"/>
  <text class="xs" x="298" y="121" text-anchor="middle">calls</text>
  <rect x="314" y="88" width="562" height="88" rx="7" fill="var(--greenFill)" stroke="var(--greenLine)"/>
  <text class="b mono" x="326" y="110" fill="var(--green)">LocalAgentSession</text>
  <text class="s" x="326" y="129">core ChatSession · model calls · tools · delegation</text>
  <text class="xs" x="326" y="149">the recorded folder is the working directory</text>
  <text class="xs" x="326" y="165">a real host shell, with the tools installed on your machine</text>
  <path d="M595 176 L595 254" fill="none" stroke="var(--greenLine)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a-green)"/>
  <text class="xs" x="607" y="216">files + durable state</text>
  <rect x="24" y="254" width="852" height="312" rx="10" fill="var(--bandFill)" stroke="var(--bandStroke)"/>
  <text class="b mono" x="38" y="278">vfs:// — the global file tree</text>
  <text class="s mono" x="38" y="298">/ = ~/.kinu/&lt;workspace&gt;/</text>
  <rect x="38" y="320" width="398" height="112" rx="7" fill="var(--greenFill)" stroke="var(--greenLine)"/>
  <text class="b" x="50" y="341" fill="var(--green)">Workspace's own space</text>
  <text class="s mono" x="50" y="362">home/&lt;agent&gt;/ · slates/</text>
  <text class="s" x="50" y="382">/skills — a read-only skill view</text>
  <text class="xs mono" x="50" y="403">own skills: home/main/skills/</text>
  <text class="xs" x="50" y="421">real files, plus views mounted over them</text>
  <rect x="38" y="444" width="398" height="108" rx="7" fill="var(--purpleFill)" stroke="var(--purpleLine)"/>
  <text class="b mono" x="50" y="465" fill="var(--purple)">agent.db · bun:sqlite</text>
  <text class="s" x="50" y="485">conversations · memory · jobs</text>
  <text class="xs" x="50" y="506">the main agent, hires and branches share this database</text>
  <text class="xs" x="50" y="534">beside home/ and slates/; /skills is a view</text>
  <rect x="452" y="320" width="410" height="232" rx="7" fill="var(--blueFill)" stroke="var(--blueLine)"/>
  <text class="b" x="464" y="341" fill="var(--blue)">/local — the folder you opened</text>
  <text class="s mono" x="464" y="363">local://src = vfs://local/src</text>
  <text class="s" x="464" y="389">file edits and project tools work here</text>
  <text class="xs" x="464" y="407">the folder is mounted into the global tree</text>
  <rect x="466" y="427" width="382" height="109" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="b" x="478" y="448">Host shell</text>
  <text class="s" x="478" y="468">real processes · git · package installs</text>
  <text class="xs" x="478" y="489">commands start in the opened folder</text>
  <text class="xs" x="478" y="507">the folder's files are the actual project files</text>
  <text class="xs" x="478" y="525">changes are checkpointed before shell work</text>
  <rect x="24" y="592" width="852" height="74" rx="7" fill="var(--slateFill)" stroke="var(--rule)" stroke-dasharray="4 3"/>
  <text class="b" x="38" y="614">No local server between the TUI and the runtime</text>
  <text class="s" x="38" y="635">LocalAgentClient calls LocalAgentSession directly; the TUI consumes the same interface for either backend.</text>
  <text class="xs" x="38" y="653">A cloud workspace uses CloudAgentClient instead, over the web app's chat protocol.</text>
</svg>

