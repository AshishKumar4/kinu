<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1190" viewBox="0 0 640 1190" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="workspace-target-title workspace-target-desc">
<title id="workspace-target-title">TARGET / DESIGN PROPOSAL: One workspace, one database</title>
<desc id="workspace-target-desc">Target design requested in user message 975. One workspace Durable Object owns one SQLite database and Nimbus workspace. Main, subordinate and exploration agents become logical identities sharing that database with actor and session scoping. Common core logic is exposed through thin role wrappers. A proposed database capability is scoped; protected policy and audit records remain outside editable working context.</desc>
