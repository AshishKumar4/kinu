<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1307" viewBox="0 0 640 1307" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="capabilities-title capabilities-desc">
<title id="capabilities-title">CURRENT + TARGET: Tools and codemode capabilities</title>
<desc id="capabilities-desc">Current native tools and execute_tools codemode reach introduced host capabilities under actor identity, role, mode and provider gates. MCP and executor availability narrow that reach. The existing state capability is actor-scoped codemode_state; raw env.db or db is not introduced. The target database capability is a design proposal scoped to permitted data and operations, not unrestricted internal SQLite access.</desc>
