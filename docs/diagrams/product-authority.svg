<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1047" viewBox="0 0 640 1047" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="authority-title authority-desc">
<title id="authority-title">TARGET / DESIGN PROPOSAL: Authority around editable agents</title>
<desc id="authority-desc">Design proposal for the requested editable agent surfaces. Admitted identity, role and mode constrain capability-scoped operations, which may edit only permitted working data after scope and revision checks. Editable loop and working-context revisions are separate from protected policy, credentials, permission grants, effect claims and raw audit. Those records have no path from the agent write capability. This diagram does not claim that the full shared-database edit protocol is implemented.</desc>
