<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1280" viewBox="0 0 640 1280" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="recovery-title recovery-desc">
<title id="recovery-title">CURRENT: Recovery starts from durable state</title>
<desc id="recovery-desc">Current recovery reads durable records rather than trusting process memory. Actor-local terminal effects and background jobs, event leases, workspace files, compaction state, SDK schedules and facet fiber metadata have distinct owners. Inspection reports saved state without invoking normal startup. Normal activation recovers pending work and replays only owed, keyed effects. This is not an exactly-once claim for arbitrary external I/O. Derived runtime and slate preview state can be rebuilt from durable source.</desc>
