<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1336" viewBox="0 0 640 1336" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="turn-title turn-desc">
<title id="turn-title">CURRENT: A turn and its model steps</title>
<desc id="turn-desc">Current simplified turn flow. A user message or durable wake is admitted with actor identity, role and trusted Plan or Build mode. Context is assembled, then step preparation handles signals, pruning and dynamic context. The model requests tools or produces output. Allowed tool calls record outcomes and loop to the next model step; a finished or stopped turn records completed, aborted or error and owed terminal effects. Cloud conversational actors use Think; local agents and swarm nodes use Core runChat.</desc>
