<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1336" viewBox="0 0 640 1336" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="turn-title turn-desc">
<title id="turn-title">CURRENT: A turn and its model steps</title>
<desc id="turn-desc">A user message or durable wake is admitted with actor identity, role and trusted mode. Context assembly and step preparation supply history, signals and dynamic context. The model requests tools or produces output. Hosted workspace roots use Think; local agents and hosted logical actors use core inference. A finished or stopped turn records completed, aborted or error and owes terminal effects, including eligible turn recording and event draining.</desc>
