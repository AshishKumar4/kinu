<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="workspace-current-title workspace-current-desc">
<title id="workspace-current-title">CURRENT: Hosted workspace ownership</title>
<desc id="workspace-current-desc">Current hosted ownership. One workspace root Durable Object holds the main agent and every subordinate and exploration actor as logical actors over one workspace SQLite, with actor_id leading every actor-owned row. The same database backs the canonical Nimbus files. Shared storage is not shared authority.</desc>
