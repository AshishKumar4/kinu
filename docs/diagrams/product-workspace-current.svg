<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="workspace-current-title workspace-current-desc">
<title id="workspace-current-title">CURRENT: Hosted workspace ownership</title>
<desc id="workspace-current-desc">Current hosted ownership. One workspace root Durable Object contains the main agent and owns the SQLite backing canonical Nimbus files and root actor state. Subordinate and exploration SDK facets each have their own actor SQLite. They access the canonical root filesystem over RPC. Shared files do not mean one shared database.</desc>
