<text x="68" y="346" font-size="24" font-weight="650" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Subordinate actor</tspan>
</text>
<text x="68" y="380" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="68" dy="0">Own session, queue,</tspan>
<tspan x="68" dy="30">home — rows, not a database</tspan>
