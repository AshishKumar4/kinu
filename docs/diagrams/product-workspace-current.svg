</text>
<text x="350" y="380" font-size="22" font-weight="400" fill="#29231C" text-anchor="start">
<tspan x="350" dy="0">Head, node or branch —</tspan>
<tspan x="350" dy="30">rows, not a database</tspan>
</text>
