<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
  <!-- A docs figure. Its sibling in this directory (same name, -dark suffix)
       is the same geometry under a different :root palette, and CONTEXT-WINDOW.md picks
       between the two with <picture>. Everything below the palette block must
       stay byte-identical in both, so edit them together. -->
  <title id="t">What each kind of agent sees</title>
  <desc id="d">Three columns, the workspace's own agent, a hired agent and a swarm node, each listing its tools, system prompt, opening messages, dynamic context and cache key.</desc>
  <style>
    :root {
      --fg: #e6edf3;
      --muted: #9198a1;
      --faint: #7d8590;
      --rule: #3d444d;
      --ruleStrong: #6e7681;
      --surface: #151b23;
      --surfaceAlt: #0d1117;
      --bandFill: #12181f;
      --bandStroke: #2f3742;
      --blue: #79c0ff;
      --blueFill: #0c2d6b22;
      --blueLine: #4493f8;
      --orange: #ffa657;
      --orangeFill: #76210022;
      --orangeLine: #db6d28;
      --green: #7ee787;
      --greenFill: #0f503622;
      --greenLine: #3fb950;
      --purple: #d2a8ff;
      --purpleFill: #4c288922;
      --purpleLine: #ab7df8;
      --pink: #ff9bce;
      --pinkFill: #7d234922;
      --pinkLine: #f778ba;
      --slateFill: #1c222b;
    }
    text { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: var(--fg); }
    text.mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .h  { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
    .b  { font-size: 13px; font-weight: 600; }
    .s  { font-size: 11.5px; fill: var(--muted); }
    .xs { font-size: 10.5px; fill: var(--faint); }
    .band { font-size: 11px; font-weight: 700; letter-spacing: .9px; fill: var(--faint); }
    .edge { fill: none; stroke: var(--ruleStrong); stroke-width: 1.4; }
    .edge-lite { fill: none; stroke: var(--rule); stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--ruleStrong)"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--blueLine)"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--purpleLine)"/>
    </marker>
    <marker id="a-pink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--pinkLine)"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--greenLine)"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--orangeLine)"/>
    </marker>
  </defs>
  <text class="h" x="58" y="30" text-anchor="start">What each agent sees</text>
  <text class="s" x="58" y="49" text-anchor="start">prompt.ts · cf-backend/src/orchestrator.ts · strategy/node-agent.ts · agent-facet/agent-turn.ts</text>
  <rect x="58" y="72" width="266" height="40" rx="7" fill="var(--blueFill)" stroke="var(--blueLine)"/>
  <text class="b" x="70" y="97" text-anchor="start" fill="var(--blue)">The workspace's own agent</text>
  <rect x="58" y="124" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="70" y="144" text-anchor="start" fill="var(--fg)">Tools</text>
  <text class="s" x="70" y="161" text-anchor="start">its role's, in this work mode;</text>
  <text class="s" x="70" y="176" text-anchor="start">agents included</text>
  <rect x="58" y="194" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="70" y="214" text-anchor="start" fill="var(--fg)">System prompt</text>
  <text class="s" x="70" y="231" text-anchor="start">core, lead doctrine,</text>
  <text class="s" x="70" y="246" text-anchor="start">workspace, agent</text>
  <rect x="58" y="264" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="70" y="284" text-anchor="start" fill="var(--fg)">Opens with</text>
  <text class="s" x="70" y="301" text-anchor="start">the conversation</text>
  <text class="s" x="70" y="316" text-anchor="start"></text>
  <rect x="58" y="334" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="70" y="354" text-anchor="start" fill="var(--fg)">Dynamic context</text>
  <text class="s" x="70" y="371" text-anchor="start">every plane, memory tail</text>
  <text class="s" x="70" y="386" text-anchor="start">included</text>
  <rect x="58" y="404" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="70" y="424" text-anchor="start" fill="var(--fg)">Cache key (cloud)</text>
  <text class="s" x="70" y="441" text-anchor="start">kinu-&lt;agent&gt;</text>
  <text class="s" x="70" y="456" text-anchor="start"></text>
  <rect x="338" y="72" width="266" height="40" rx="7" fill="var(--purpleFill)" stroke="var(--purpleLine)"/>
  <text class="b" x="350" y="97" text-anchor="start" fill="var(--purple)">A hired agent</text>
  <rect x="338" y="124" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="350" y="144" text-anchor="start" fill="var(--fg)">Tools</text>
  <text class="s" x="350" y="161" text-anchor="start">its role's; agents within</text>
  <text class="s" x="350" y="176" text-anchor="start">its depth; report</text>
  <rect x="338" y="194" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="350" y="214" text-anchor="start" fill="var(--fg)">System prompt</text>
  <text class="s" x="350" y="231" text-anchor="start">core, workspace, agent;</text>
  <text class="s" x="350" y="246" text-anchor="start">no lead doctrine</text>
  <rect x="338" y="264" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="350" y="284" text-anchor="start" fill="var(--fg)">Opens with</text>
  <text class="s" x="350" y="301" text-anchor="start">the parent's brief; inherits</text>
  <text class="s" x="350" y="316" text-anchor="start">the conversation if asked</text>
  <rect x="338" y="334" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="350" y="354" text-anchor="start" fill="var(--fg)">Dynamic context</text>
  <text class="s" x="350" y="371" text-anchor="start">its own tasks, jobs, hires;</text>
  <text class="s" x="350" y="386" text-anchor="start">no memory tail</text>
  <rect x="338" y="404" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="350" y="424" text-anchor="start" fill="var(--fg)">Cache key (cloud)</text>
  <text class="s" x="350" y="441" text-anchor="start">kinu-&lt;its own name&gt;</text>
  <text class="s" x="350" y="456" text-anchor="start"></text>
  <rect x="618" y="72" width="266" height="40" rx="7" fill="var(--greenFill)" stroke="var(--greenLine)"/>
  <text class="b" x="630" y="97" text-anchor="start" fill="var(--green)">A swarm node</text>
  <rect x="618" y="124" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="630" y="144" text-anchor="start" fill="var(--fg)">Tools</text>
  <text class="s" x="630" y="161" text-anchor="start">eval, shell, file, web, report;</text>
  <text class="s" x="630" y="176" text-anchor="start">never agents, memory, tasks</text>
  <rect x="618" y="194" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="630" y="214" text-anchor="start" fill="var(--fg)">System prompt</text>
  <text class="s" x="630" y="231" text-anchor="start">the search's half, then</text>
  <text class="s" x="630" y="246" text-anchor="start">the node's isolation rules</text>
  <rect x="618" y="264" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="630" y="284" text-anchor="start" fill="var(--fg)">Opens with</text>
  <text class="s" x="630" y="301" text-anchor="start">its seed; inherits the</text>
  <text class="s" x="630" y="316" text-anchor="start">conversation if asked</text>
  <rect x="618" y="334" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="630" y="354" text-anchor="start" fill="var(--fg)">Dynamic context</text>
  <text class="s" x="630" y="371" text-anchor="start">its own state; no memory</text>
  <text class="s" x="630" y="386" text-anchor="start">tail, no delegates</text>
  <rect x="618" y="404" width="266" height="62" rx="7" fill="var(--slateFill)" stroke="var(--rule)"/>
  <text class="xs" x="630" y="424" text-anchor="start" fill="var(--fg)">Cache key (cloud)</text>
  <text class="s" x="630" y="441" text-anchor="start">kinu-&lt;search root&gt;,</text>
  <text class="s" x="630" y="456" text-anchor="start">shared by every node</text>
  <text class="xs" x="58" y="504" text-anchor="start">Every one of them gets the dynamic block's runtime facts: backend, model, date, and the working directory where there is one.</text>
</svg>
